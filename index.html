/** Affiche les erreurs { idChamp: message } ; renvoie true s'il y en a. */
function afficherErreurs(racine, erreurs, messageGlobal = '') {
  $$('.champ-erreur[id]', racine).forEach(e => { e.hidden = true; e.textContent = ''; });
  $$('[aria-invalid]', racine).forEach(e => e.removeAttribute('aria-invalid'));
  const ids = Object.keys(erreurs);
  for (const id of ids) {
    const input = racine.querySelector('#' + CSS.escape(id));
    const err = racine.querySelector('#' + CSS.escape(id + '-err'));
    if (input) input.setAttribute('aria-invalid', 'true');
    if (err) { err.textContent = erreurs[id]; err.hidden = false; }
  }
  const glob = racine.querySelector('.form-erreur');
  const n = ids.length + (messageGlobal ? 1 : 0);
  if (glob) {
    glob.hidden = !n;
    glob.textContent = messageGlobal || (n ? `${n > 1 ? `${n} champs à corriger` : 'Un champ à corriger'} (en rouge).` : '');
  }
  if (n) {
    const premier = racine.querySelector('[aria-invalid="true"], .selecteur.invalide') || glob;
    if (premier) premier.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  return n > 0;
}

/* =====================================================================
   SÉLECTEUR DE PRODUIT (recherche instantanée)
   ===================================================================== */
/**
 * Recherche insensible à la casse et aux accents, plusieurs mots possibles.
 * Chaque mot doit apparaître dans la désignation ou le code.
 */
function rechercherProduits(q, famille = '', { inactifs = false } = {}) {
  const termes = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
  const base = etat.produits.filter(p => (inactifs || p.actif) && (!famille || p.famille === famille));
  if (!termes.length) return base;
  const res = [];
  base.forEach((p, ordre) => {
    const texte = ' ' + norm(p.designation + ' ' + (p.code || '')).replace(/[^a-z0-9]+/g, ' ') + ' ';
    let score = 0;
    for (const t of termes) {
      if (!texte.includes(t)) return;
      if (texte.includes(' ' + t)) score++;
    }
    res.push({ p, score, ordre });
  });
  res.sort((a, b) => b.score - a.score || a.ordre - b.ordre);
  return res.map(r => r.p);
}
/** Met en évidence les mots recherchés dans la désignation (affichage). */
function surligner(texte, q) {
  const termes = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
  if (!termes.length) return esc(texte);
  const n = norm(texte);
  const marques = new Array(texte.length).fill(false);
  for (const t of termes) {
    let i = n.indexOf(t);
    while (i >= 0) { for (let k = i; k < i + t.length; k++) marques[k] = true; i = n.indexOf(t, i + t.length); }
  }
  // norm() ne change pas la longueur des caractères usuels du catalogue (accents décomposés puis retirés)
  if (n.length !== texte.length) return esc(texte);
  let out = '', dedans = false;
  for (let k = 0; k < texte.length; k++) {
    if (marques[k] && !dedans) { out += '<mark>'; dedans = true; }
    if (!marques[k] && dedans) { out += '</mark>'; dedans = false; }
    out += esc(texte[k]);
  }
  return out + (dedans ? '</mark>' : '');
}

/** Ouvre le sélecteur ; résout avec l'id du produit choisi, '' pour « aucun », ou null si annulé. */
function choisirProduit({ famille = null, selection = null, facultatif = false } = {}) {
  return new Promise(resolve => {
    let fam = famille || '';
    let resolu = false;
    const P = prefixe();
    const contenu = `<div class="recherche-fixe">
        <label class="sr" for="${P}q">Rechercher un produit</label>
        <input class="input" id="${P}q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Désignation ou code article">
        <div class="puces" role="group" aria-label="Filtrer par famille">${pucesFamilles(fam, famille)}</div>
      </div>
      <div class="res-compte" aria-live="polite"></div>
      <ul class="resultats"></ul>`;
    const f = ouvrirFeuille({
      titre: famille ? `Produit · ${FAMILLE[famille].label}` : 'Choisir un produit',
      contenu, sansContenu: true,
      onFermer: () => { if (!resolu) { resolu = true; resolve(null); } },
    });
    const q = f.querySelector('#' + P + 'q');
    const ul = f.querySelector('.resultats');
    const compte = f.querySelector('.res-compte');
    const maj = () => {
      const res = rechercherProduits(q.value, fam);
      compte.textContent = pluriel(res.length, 'produit');
      ul.innerHTML = (facultatif ? `<li><button type="button" class="res" data-pid=""><span class="txt"><b>Aucun produit précis</b><small>Intérêt pour la famille seulement</small></span></button></li>` : '') +
        res.map(p => `<li><button type="button" class="res" data-pid="${p.id}"><span class="txt"><b>${surligner(p.designation, q.value)}</b><small>${esc(metaProduit(p))}</small></span>${p.id === selection ? `<span class="coche">${ICONES.coche}</span>` : ''}</button></li>`).join('') +
        (!res.length ? `<li class="vide-mini" style="padding:20px 16px">Aucun produit ne correspond. Il peut être ajouté dans Plus › Catalogue.</li>` : '');
    };
    q.addEventListener('input', maj);
    f.querySelector('.puces').addEventListener('click', e => {
      const b = e.target.closest('[data-fam]');
      if (!b || famille) return;
      fam = b.dataset.fam;
      f.querySelector('.puces').innerHTML = pucesFamilles(fam);
      maj();
    });
    ul.addEventListener('click', e => {
      const b = e.target.closest('[data-pid]');
      if (!b) return;
      resolu = true;
      resolve(b.dataset.pid);
      fermerFeuille(f);
    });
    maj();
    q.focus({ preventScroll: true });
  });
}

/* =====================================================================
   ÉDITEUR DE LIGNES (offres, ventes, écran « gagnée »)
   ===================================================================== */
function ligneBrouillon(l) {
  return l
    ? { id: l.id || uid(), produitId: l.produitId, qteTxt: String(l.quantite), caTxt: versSaisie(l.ca), err: null }
    : { id: uid(), produitId: null, qteTxt: '1', caTxt: '', err: null };
}
function htmlLigne(l, i, n, produitModifiable) {
  const p = l.produitId ? produit(l.produitId) : null;
  const err = l.err || {};
  return `<div class="ligne" data-id="${l.id}">
    <div class="ligne-tete"><span class="ligne-num">Ligne ${i + 1}</span>${n > 1 ? `<button type="button" class="btn-icone" data-l="suppr" aria-label="Supprimer la ligne ${i + 1}">${ICONES.poubelle}</button>` : ''}</div>
    ${produitModifiable
      ? `<button type="button" class="selecteur ${err.produit ? 'invalide' : ''}" data-l="produit" aria-label="Produit de la ligne ${i + 1} : ${p ? esc(p.designation) : 'à choisir'}">${p ? `<span class="sel-nom">${esc(p.designation)}</span><span class="sel-meta">${esc(metaProduit(p))}</span>` : '<span class="sel-vide">Choisir un produit…</span>'}</button>`
      : `<div class="selecteur fixe"><span class="sel-nom">${esc(p ? p.designation : 'Produit supprimé')}</span><span class="sel-meta">${p ? esc(metaProduit(p)) : ''}</span></div>`}
    ${err.produit ? `<div class="champ-erreur">${esc(err.produit)}</div>` : ''}
    <div class="ligne-champs">
      <div class="champ"><label class="champ-label" for="${l.id}-q">Quantité</label>
        <input class="input" id="${l.id}-q" data-champ="quantite" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${esc(l.qteTxt)}" ${err.quantite ? 'aria-invalid="true"' : ''}>
        ${err.quantite ? `<div class="champ-erreur">${esc(err.quantite)}</div>` : ''}</div>
      <div class="champ"><label class="champ-label" for="${l.id}-ca">CA HT (€)</label>
        <input class="input" id="${l.id}-ca" data-champ="ca" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(l.caTxt)}" ${err.ca ? 'aria-invalid="true"' : ''}>
        ${err.ca ? `<div class="champ-erreur">${esc(err.ca)}</div>` : ''}</div>
    </div>
  </div>`;
}
function editeurLignes(conteneur, lignes, { produitModifiable = true, onChange = () => {} } = {}) {
  const rendreLignes = () => { conteneur.innerHTML = lignes.map((l, i) => htmlLigne(l, i, lignes.length, produitModifiable)).join(''); };
  conteneur.addEventListener('click', async e => {
    const b = e.target.closest('[data-l]');
    if (!b) return;
    const id = b.closest('.ligne').dataset.id;
    const l = lignes.find(x => x.id === id);
    if (b.dataset.l === 'suppr') {
      lignes.splice(lignes.indexOf(l), 1);
      rendreLignes(); onChange();
    } else if (b.dataset.l === 'produit') {
      const pid = await choisirProduit({ selection: l.produitId });
      if (pid) {
        l.produitId = pid;
        if (l.err) delete l.err.produit;
        rendreLignes(); onChange();
        const ca = conteneur.querySelector(`[data-id="${CSS.escape(id)}"] [data-champ="ca"]`);
        if (ca && !l.caTxt) ca.focus({ preventScroll: true });
      }
    }
  });
  conteneur.addEventListener('input', e => {
    const inp = e.target;
    const li = inp.closest('.ligne');
    if (!li) return;
    const l = lignes.find(x => x.id === li.dataset.id);
    if (inp.dataset.champ === 'quantite') l.qteTxt = inp.value;
    if (inp.dataset.champ === 'ca') l.caTxt = inp.value;
    onChange();
  });
  rendreLignes();
  return {
    rendre: rendreLignes,
    async ajouter() {
      const l = ligneBrouillon();
      lignes.push(l);
      rendreLignes(); onChange();
      if (produitModifiable) {
        const pid = await choisirProduit();
        if (pid) { l.produitId = pid; rendreLignes(); onChange(); }
      }
    },
  };
}
/** Valide les lignes ; renvoie { ok, lignes } (lignes propres) et marque les erreurs. */
function validerLignes(lignes) {
  let ok = lignes.length > 0;
  const propres = lignes.map(l => {
    const err = {};
    if (!l.produitId || !produit(l.produitId)) err.produit = 'Choisis un produit.';
    const q = parseEntier(l.qteTxt);
    if (!(q >= 1)) err.quantite = 'Entier ≥ 1.';
    const ca = parseMontant(l.caTxt);
    if (!(ca > 0)) err.ca = 'Montant > 0, ex. 12500,50.';
    l.err = Object.keys(err).length ? err : null;
    if (l.err) ok = false;
    return { id: l.id, produitId: l.produitId, quantite: q, ca };
  });
  return { ok, lignes: propres };
}
function totalBrouillon(lignes) { return lignes.reduce((s, l) => s + (parseMontant(l.caTxt) || 0), 0); }

/* =====================================================================
   FORMULAIRE OFFRE
   ===================================================================== */
function formulaireOffre(id = null) {
  const existante = id ? etat.offres.find(o => o.id === id) : null;
  if (id && !existante) return;
  const P = prefixe();
  const d = existante || { idClient: '', client: '', affaire: 'Commerce', dateEmission: aujourdhui(), chance: 50, relanceManuelle: false, dateRelance: null, statut: 'en_cours' };
  const lignes = existante ? existante.lignes.map(ligneBrouillon) : [ligneBrouillon()];
  let bloc = '';
  if (existante && existante.statut === 'gagnee') bloc = `<div class="form-info ok">${ICONES.coche}<span>Gagnée le ${fmtDate(existante.dateCloture)}. La vente a été créée.</span></div>`;
  if (existante && existante.statut === 'perdue') bloc = `<div class="form-info bad">${ICONES.info}<span>Perdue le ${fmtDate(existante.dateCloture)}.</span></div>`;
  let actions = '';
  if (existante) {
    if (existante.statut === 'en_cours') {
      actions = `<h3 class="form-titre">Actions</h3><div class="actions deux">
        <button type="button" class="btn btn-ok" data-f="gagnee">Gagnée…</button>
        <button type="button" class="btn btn-sec" data-f="perdue">Perdue</button></div>
        <div class="actions"><button type="button" class="btn btn-danger btn-bloc" data-f="supprimer">Supprimer l'offre</button></div>`;
    } else {
      actions = `<h3 class="form-titre">Actions</h3><div class="actions">
        ${existante.statut === 'perdue' ? '<button type="button" class="btn btn-sec btn-bloc" data-f="rouvrir">Rouvrir l\'offre</button>' : ''}
        <button type="button" class="btn btn-danger btn-bloc" data-f="supprimer">Supprimer l'offre</button></div>`;
    }
  }
  const contenu = `<form novalidate>
    ${bloc}
    <div class="form-erreur" role="alert" hidden></div>
    ${champ({ id: P + 'client', label: 'Nom du client', valeur: d.client, requis: true, attrs: 'autocomplete="off" autocapitalize="words"' })}
    ${champ({ id: P + 'idClient', label: 'ID client (ERP)', valeur: d.idClient, attrs: 'autocomplete="off" autocapitalize="characters" autocorrect="off"' })}
    ${champSegment({ nom: P + 'affaire', label: 'Affaire', options: [{ v: 'Commerce', l: 'Commerce' }, { v: 'SAV', l: 'SAV' }], valeur: d.affaire })}
    <div class="grille2">
      ${champ({ id: P + 'dateEmission', label: "Date d'émission", type: 'date', valeur: d.dateEmission, requis: true })}
      ${champSelect({ id: P + 'chance', label: '% de chance', options: CHANCES.map(c => ({ v: c, l: c + ' %' })), valeur: d.chance })}
    </div>
    ${champInterrupteur({ id: P + 'relance', titre: 'Relance manuelle', aide: 'Désactivée : relance automatique par l\'ERP', coche: d.relanceManuelle })}
    <div data-zone="relance" ${d.relanceManuelle ? '' : 'hidden'}>
      ${champ({ id: P + 'dateRelance', label: 'Date de prochaine relance', type: 'date', valeur: d.dateRelance || ajouterJours(aujourdhui(), 7), requis: true })}
    </div>
    <h3 class="form-titre">Lignes</h3>
    <div data-zone="lignes"></div>
    <button type="button" class="btn btn-sec btn-bloc" data-f="ajouter-ligne">${ICONES.ajout}Ajouter une ligne</button>
    <div class="carte totaux">
      <div class="kv"><span>CA de l'offre (HT)</span><b data-total>0 €</b></div>
      <div class="kv"><span>CA pondéré</span><b data-pondere>0 €</b></div>
    </div>
    ${actions}
  </form>`;
  const f = ouvrirFeuille({ titre: existante ? 'Offre' : 'Nouvelle offre', contenu, pied: `<button type="button" class="btn btn-prim btn-bloc" data-f="enregistrer">Enregistrer</button>` });
  const form = f.querySelector('form');
  const val = n => f.querySelector('#' + P + n).value;
  const majTotaux = () => {
    const t = totalBrouillon(lignes);
    f.querySelector('[data-total]').textContent = eurExact(t);
    f.querySelector('[data-pondere]').textContent = eurExact(Math.round(t * Number(val('chance'))) / 100);
  };
  const ed = editeurLignes(f.querySelector('[data-zone="lignes"]'), lignes, { onChange: majTotaux });
  majTotaux();
  f.querySelector('#' + P + 'chance').addEventListener('change', majTotaux);
  f.querySelector('#' + P + 'relance').addEventListener('change', e => { f.querySelector('[data-zone="relance"]').hidden = !e.target.checked; });

  /** Lit et valide le formulaire ; renvoie les données propres ou null. */
  const lire = () => {
    const erreurs = {};
    const client = val('client').trim();
    if (!client) erreurs[P + 'client'] = 'Indique le nom du client.';
    const dateEmission = val('dateEmission');
    if (!dateValide(dateEmission)) erreurs[P + 'dateEmission'] = 'Date obligatoire.';
    const relanceManuelle = f.querySelector('#' + P + 'relance').checked;
    let dateRelance = null;
    if (relanceManuelle) {
      dateRelance = val('dateRelance');
      if (!dateValide(dateRelance)) erreurs[P + 'dateRelance'] = 'Date de relance obligatoire.';
    }
    const vl = validerLignes(lignes);
    ed.rendre();
    const nbErr = Object.keys(erreurs).length + lignes.filter(l => l.err).length;
    const msg = !lignes.length ? 'Ajoute au moins une ligne.' : (nbErr ? `${nbErr > 1 ? `${nbErr} éléments à corriger` : 'Un élément à corriger'} (en rouge).` : '');
    if (afficherErreurs(form, erreurs, msg) || !vl.ok) return null;
    return {
      client, idClient: val('idClient').trim(),
      affaire: f.querySelector(`input[name="${P}affaire"]:checked`).value,
      dateEmission, chance: Number(val('chance')),
      relanceManuelle, dateRelance,
      lignes: vl.lignes,
    };
  };
  const enregistrer = () => {
    const donnees = lire();
    if (!donnees) return null;
    const t = maintenantISO();
    let o = existante;
    if (o) Object.assign(o, donnees, { modifieLe: t });
    else {
      o = { id: uid(), ...donnees, statut: 'en_cours', dateCloture: null, creeLe: t, modifieLe: t };
      etat.offres.push(o);
    }
    sauver();
    return o;
  };

  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    const action = b.dataset.f;
    if (action === 'ajouter-ligne') ed.ajouter();
    if (action === 'enregistrer') {
      if (enregistrer()) { fermerFeuille(f); toast('Offre enregistrée'); rendre(); }
    }
    if (action === 'gagnee') {
      const o = enregistrer();
      if (o) { rendre(); ecranGagnee(o, f); }
    }
    if (action === 'perdue') {
      if (!lire()) return;
      if (!(await confirmer('Offre perdue ?', `L'offre ${d.client || ''} passera dans « Clôturées ». Tu pourras la rouvrir.`, 'Marquer perdue', true))) return;
      const o = enregistrer();
      if (!o) return;
      Object.assign(o, { statut: 'perdue', dateCloture: aujourdhui(), modifieLe: maintenantISO() });
      sauver(); fermerFeuille(f); toast('Offre marquée perdue', 'warn'); rendre();
    }
    if (action === 'rouvrir') {
      Object.assign(existante, { statut: 'en_cours', dateCloture: null, modifieLe: maintenantISO() });
      sauver(); fermerFeuille(f); toast('Offre rouverte'); rendre();
    }
    if (action === 'supprimer') {
      if (!(await confirmer("Supprimer l'offre ?", 'Cette action est définitive.', 'Supprimer', true))) return;
      etat.offres = etat.offres.filter(o => o.id !== existante.id);
      sauver(); fermerFeuille(f); toast('Offre supprimée', 'warn'); rendre();
    }
  });
}

/** Écran « garde-fou » du passage en Gagnée : lignes modifiables, date et canal, puis création de la vente. */
function ecranGagnee(offre, feuilleOffre) {
  const P = prefixe();
  const lignes = offre.lignes.map(l => ligneBrouillon({ ...l, id: uid() }));
  const contenu = `<form novalidate>
    <div class="form-info neutre">${ICONES.info}<span>Vérifie ce que le client prend réellement : tu peux ajuster les quantités, les montants ou retirer une ligne.</span></div>
    <div class="form-erreur" role="alert" hidden></div>
    <div class="carte" style="margin-bottom:16px"><div class="item-titre">${esc(offre.client)}${offre.idClient ? `<span class="item-id">${esc(offre.idClient)}</span>` : ''}</div><div class="item-l2">Offre émise le ${fmtDate(offre.dateEmission)} · ${esc(offre.affaire)}</div></div>
    <div class="grille2">
      ${champ({ id: P + 'date', label: 'Date de vente', type: 'date', valeur: aujourdhui(), requis: true })}
      ${champSelect({ id: P + 'canal', label: 'Canal', options: optionsCanal(), valeur: 'direct' })}
    </div>
    <h3 class="form-titre">Lignes vendues</h3>
    <div data-zone="lignes"></div>
    <div class="carte totaux"><div class="kv"><span>CA de la vente (HT)</span><b data-total>0 €</b></div></div>
  </form>`;
  const f = ouvrirFeuille({ titre: 'Offre gagnée', contenu, pied: `<button type="button" class="btn btn-ok btn-bloc" data-f="valider">Créer la vente</button>` });
  const form = f.querySelector('form');
  const majTotal = () => { f.querySelector('[data-total]').textContent = eurExact(totalBrouillon(lignes)); };
  const ed = editeurLignes(f.querySelector('[data-zone="lignes"]'), lignes, { produitModifiable: false, onChange: majTotal });
  majTotal();
  f.querySelector('[data-f="valider"]').addEventListener('click', () => {
    const erreurs = {};
    const date = f.querySelector('#' + P + 'date').value;
    if (!dateValide(date)) erreurs[P + 'date'] = 'Date obligatoire.';
    const vl = validerLignes(lignes);
    ed.rendre();
    const nbErr = Object.keys(erreurs).length + lignes.filter(l => l.err).length;
    if (afficherErreurs(form, erreurs, !lignes.length ? 'Garde au moins une ligne.' : (nbErr ? 'Corrige les éléments en rouge.' : '')) || !vl.ok) return;
    const t = maintenantISO();
    // La vente est indépendante de l'offre : aucun lien n'est conservé
    etat.ventes.push({
      id: uid(), date, idClient: offre.idClient, client: offre.client, affaire: offre.affaire,
      canal: f.querySelector('#' + P + 'canal').value, lignes: vl.lignes, creeLe: t, modifieLe: t,
    });
    Object.assign(offre, { statut: 'gagnee', dateCloture: aujourdhui(), modifieLe: t });
    sauver();
    fermerFeuille(f);
    if (feuilleOffre) fermerFeuille(feuilleOffre);
    toast(`Vente créée · ${eur(vl.lignes.reduce((s, l) => s + l.ca, 0))}`);
    rendre();
  });
}

function optionsCanal(valeurActuelle) {
  const dist = etat.distributeurs.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  const opts = [{ v: 'direct', l: 'Direct' }, ...dist.map(d => ({ v: d.id, l: d.nom }))];
  if (valeurActuelle && valeurActuelle !== 'direct' && !dist.some(d => d.id === valeurActuelle)) opts.push({ v: valeurActuelle, l: 'Distributeur supprimé' });
  return opts;
}

/** Bouton « Relancé » : reporte la prochaine relance (J+7 par défaut) ou passe en auto. */
async function relanceFaite(id) {
  const o = etat.offres.find(x => x.id === id);
  if (!o) return;
  const P = prefixe();
  let nouvelleDate = null;
  const choix = await modale({
    titre: 'Relance faite',
    html: `<p style="margin-bottom:14px">${esc(o.client)} · ${eur(totalDoc(o))}</p>
      ${champ({ id: P + 'date', label: 'Prochaine relance', type: 'date', valeur: ajouterJours(aujourdhui(), 7), requis: true })}`,
    boutons: [
      { libelle: 'Reporter la relance', cls: 'btn-prim', valeur: 'reporter', avant: fond => {
        const v = fond.querySelector('#' + P + 'date').value;
        if (!dateValide(v)) { afficherErreurs(fond, { [P + 'date']: 'Date obligatoire.' }); return false; }
        nouvelleDate = v; return true;
      } },
      { libelle: "Passer en relance auto (ERP)", cls: 'btn-sec', valeur: 'auto' },
      { libelle: 'Annuler', cls: 'btn-sec', valeur: null },
    ],
  });
  if (!choix) return;
  if (choix === 'reporter') { o.dateRelance = nouvelleDate; o.relanceManuelle = true; }
  if (choix === 'auto') { o.relanceManuelle = false; o.dateRelance = null; }
  o.modifieLe = maintenantISO();
  sauver();
  toast(choix === 'auto' ? 'Relance confiée à l\'ERP' : `Prochaine relance le ${fmtDate(o.dateRelance)}`);
  rendre();
}

    ${champ({ id: P + 'idClient', label: 'ID client (ERP)', valeur: d.idClient, attrs: 'autocomplete="off" autocapitalize="characters" autocorrect="off"' })}

    <div class="carte totaux"><div class="kv"><span>CA de la vente (HT)</span><b data-total>0 €</b></div></div>
    ${existante ? `<h3 class="form-titre">Actions</h3><div class="actions"><button type="button" class="btn btn-danger btn-bloc" data-f="supprimer">Supprimer la vente</button></div>` : ''}
  </form>`;
  const f = ouvrirFeuille({ titre: existante ? 'Vente' : 'Nouvelle vente', contenu, pied: `<button type="button" class="btn btn-prim btn-bloc" data-f="enregistrer">Enregistrer</button>` });
  const form = f.querySelector('form');

      ed.rendre();

      sauver();
      fermerFeuille(f);
      const po = periodeObjectif();
      toast(dansPeriode(date, po) ? 'Vente enregistrée' : 'Vente enregistrée (hors période d\'objectif)', dansPeriode(date, po) ? 'ok' : 'warn');
      rendre();
    }
    if (b.dataset.f === 'supprimer') {
      if (!(await confirmer('Supprimer la vente ?', 'Cette action est définitive.', 'Supprimer', true))) return;
      etat.ventes = etat.ventes.filter(v => v.id !== existante.id);
      sauver(); fermerFeuille(f); toast('Vente supprimée', 'warn'); rendre();

}

function produitUtilise(id) {
  return etat.offres.some(o => o.lignes.some(l => l.produitId === id)) ||
    etat.ventes.some(v => v.lignes.some(l => l.produitId === id)) ||
    etat.rdvs.some(r => r.produitId === id);
}
function formulaireProduit(id = null) {
  const existant = id ? produit(id) : null;
  const P = prefixe();
  const d = existant || { code: '', designation: '', famille: ui.cat.famille || '', actif: true };
  const utilise = existant && produitUtilise(existant.id);
  const contenu = `<form novalidate>
    <div class="form-erreur" role="alert" hidden></div>
    ${champ({ id: P + 'designation', label: 'Désignation', valeur: d.designation, requis: true, attrs: 'autocomplete="off"' })}
    ${champ({ id: P + 'code', label: 'Code article', valeur: d.code, aide: 'Facultatif, unique s\'il est renseigné (ex. ART-004531).', attrs: 'autocomplete="off" autocapitalize="characters" autocorrect="off"' })}
    ${champSelect({ id: P + 'famille', label: 'Famille', requis: true, valeur: d.famille, options: [{ v: '', l: 'Choisir une famille…' }, ...FAMILLES.map(f => ({ v: f.id, l: `${GROUPE[f.groupe].label} › ${f.label}` }))] })}

    ${existant ? `<h3 class="form-titre">Actions</h3><div class="actions">${utilise

      : '<button type="button" class="btn btn-danger btn-bloc" data-f="supprimer">Supprimer le produit</button>'}</div>` : ''}
  </form>`;

  const form = f.querySelector('form');
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    if (b.dataset.f === 'enregistrer') {
      const designation = f.querySelector('#' + P + 'designation').value.trim();
      const code = f.querySelector('#' + P + 'code').value.trim();

}

/* =====================================================================
   FORMULAIRE RDV
   ===================================================================== */
function formulaireRdv(id = null) {
  const existant = id ? etat.rdvs.find(r => r.id === id) : null;
  if (id && !existant) return;
  const P = prefixe();
  const d = existant || { date: aujourdhui(), heure: '09:00', duree: 60, idClient: '', client: '', famille: '', produitId: null, lieu: '', fait: false };
  let produitId = d.produitId || null;
  const contenu = `<form novalidate>
    ${existant && agendaModifie(existant) ? `<div class="form-info warn">${ICONES.alerte}<span>Modifié depuis l'ajout à l'agenda : renvoie-le et supprime l'ancien dans Calendrier.</span></div>` : ''}
    <div class="form-erreur" role="alert" hidden></div>
    <div class="grille2">
      ${champ({ id: P + 'date', label: 'Date', type: 'date', valeur: d.date, requis: true })}
      ${champ({ id: P + 'heure', label: 'Heure de début', type: 'time', valeur: d.heure, requis: true })}
    </div>
    ${champSelect({ id: P + 'duree', label: 'Durée', options: DUREES.map(x => ({ v: x.v, l: x.l })), valeur: d.duree })}
    ${champ({ id: P + 'client', label: 'Nom du client', valeur: d.client, requis: true, attrs: 'autocomplete="off" autocapitalize="words"' })}
    ${champ({ id: P + 'idClient', label: 'ID client (ERP)', valeur: d.idClient, attrs: 'autocomplete="off" autocapitalize="characters" autocorrect="off"' })}
    ${champSelect({ id: P + 'famille', label: 'Intérêt : famille', requis: true, valeur: d.famille, options: [{ v: '', l: 'Choisir une famille…' }, ...FAMILLES.map(f => ({ v: f.id, l: f.label }))] })}
    <div class="champ"><span class="champ-label" id="${P}prod-l">Intérêt : produit (facultatif)</span><div data-zone="produit"></div></div>
    ${champ({ id: P + 'lieu', label: 'Lieu', valeur: d.lieu, placeholder: 'Adresse ou ville (repris dans l\'agenda)', attrs: 'autocomplete="off"' })}
    ${champInterrupteur({ id: P + 'fait', titre: 'RDV fait', coche: d.fait })}
    ${existant ? `<h3 class="form-titre">Actions</h3><div class="actions">
      <button type="button" class="btn btn-sec btn-bloc" data-f="agenda">${ICONES.agenda}Ajouter à l'agenda</button>
      ${existant.agendaAjouteLe ? `<p class="champ-aide">Dernier ajout à l'agenda : ${fmtDateHeure(existant.agendaAjouteLe)}</p>` : ''}
      <button type="button" class="btn btn-danger btn-bloc" data-f="supprimer">Supprimer le RDV</button></div>` : ''}
  </form>`;
  const f = ouvrirFeuille({ titre: existant ? 'Rendez-vous' : 'Nouveau RDV', contenu, pied: `<button type="button" class="btn btn-prim btn-bloc" data-f="enregistrer">Enregistrer</button>` });
  const form = f.querySelector('form');
  const val = n => f.querySelector('#' + P + n).value;
  const selFam = f.querySelector('#' + P + 'famille');
  const zoneProd = f.querySelector('[data-zone="produit"]');
  const majProduit = () => {
    const fam = selFam.value;
    if (produitId && familleDe(produitId) !== fam) produitId = null;
    const p = produitId ? produit(produitId) : null;
    zoneProd.innerHTML = `<button type="button" class="selecteur" data-f="produit" aria-labelledby="${P}prod-l" ${fam ? '' : 'disabled'}>${p ? `<span class="sel-nom">${esc(p.designation)}</span><span class="sel-meta">${esc(metaProduit(p))}</span>` : `<span class="sel-vide">${fam ? 'Choisir un produit (facultatif)…' : 'Choisis d\'abord une famille'}</span>`}</button>`;
  };
  selFam.addEventListener('change', majProduit);
  majProduit();
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    if (b.dataset.f === 'produit') {
      const pid = await choisirProduit({ famille: selFam.value, selection: produitId, facultatif: true });
      if (pid !== null) { produitId = pid || null; majProduit(); }
    }
    if (b.dataset.f === 'enregistrer') {
      const erreurs = {};
      const date = val('date'), heure = val('heure'), client = val('client').trim(), famille = selFam.value;
      if (!dateValide(date)) erreurs[P + 'date'] = 'Date obligatoire.';
      if (!/^\d{2}:\d{2}/.test(heure)) erreurs[P + 'heure'] = 'Heure obligatoire.';
      if (!client) erreurs[P + 'client'] = 'Indique le nom du client.';
      if (!FAMILLE[famille]) erreurs[P + 'famille'] = 'Choisis une famille.';
      if (afficherErreurs(form, erreurs)) return;
      const t = maintenantISO();
      const donnees = { date, heure: heure.slice(0, 5), duree: Number(val('duree')), client, idClient: val('idClient').trim(), famille, produitId, lieu: val('lieu').trim(), fait: f.querySelector('#' + P + 'fait').checked };
      let r = existant;
      if (r) Object.assign(r, donnees, { modifieLe: t });
      else { r = { id: uid(), ...donnees, agendaAjouteLe: null, agendaSignature: null, creeLe: t, modifieLe: t }; etat.rdvs.push(r); }
      sauver(); fermerFeuille(f); rendre();
      if (!existant) toast('RDV enregistré', 'ok', { libelle: "Ajouter à l'agenda", fn: () => feuilleAgenda(r.id) });
      else if (agendaModifie(r)) toast("RDV modifié : pense à le renvoyer dans l'agenda", 'warn', { libelle: 'Agenda', fn: () => feuilleAgenda(r.id) });
      else toast('RDV enregistré');
    }
    if (b.dataset.f === 'agenda') feuilleAgenda(existant.id);
    if (b.dataset.f === 'supprimer') {
      if (!(await confirmer('Supprimer le RDV ?', existant.agendaAjouteLe ? 'Pense aussi à le supprimer dans Calendrier.' : 'Cette action est définitive.', 'Supprimer', true))) return;
      etat.rdvs = etat.rdvs.filter(x => x.id !== existant.id);
      sauver(); fermerFeuille(f); toast('RDV supprimé', 'warn'); rendre();
    }
  });
}

/* =====================================================================
   AGENDA APPLE : génération du fichier .ics (un seul VEVENT)
   ===================================================================== */
function echapperIcs(s) { return String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
/** Plie les lignes à 75 octets (RFC 5545). */
function plierIcs(ligne) {
  const enc = new TextEncoder();
  if (enc.encode(ligne).length <= 75) return ligne;
  const morceaux = [];
  let cur = '', taille = 0;
  for (const ch of ligne) {
    const n = enc.encode(ch).length;
    if (taille + n > 75) { morceaux.push(cur); cur = ' ' + ch; taille = 1 + n; }
    else { cur += ch; taille += n; }
  }
  morceaux.push(cur);
  return morceaux.join('\r\n');
}
function dateHeureIcs(date, heure, minutesEnPlus = 0) {
  const [y, m, d] = date.split('-').map(Number);
  const [hh, mm] = heure.split(':').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d, hh, mm) + minutesEnPlus * 60000); // heure « murale », sans fuseau
  return `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00`;
}
function genererIcs(r) {
  const n = new Date();
  const stamp = `${n.getUTCFullYear()}${pad(n.getUTCMonth() + 1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}${pad(n.getUTCSeconds())}Z`;
  const fam = FAMILLE[r.famille] ? FAMILLE[r.famille].label : '';
  const p = r.produitId ? produit(r.produitId) : null;
  const desc = [r.idClient ? `ID client : ${r.idClient}` : '', p ? `Produit d'intérêt : ${p.designation}${p.code ? ' (' + p.code + ')' : ''}` : (fam ? `Intérêt : ${fam}` : '')].filter(Boolean).join('\n');
  const lignes = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Suivi commercial//FR',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE',
    'TZID:Europe/Paris',
    'BEGIN:DAYLIGHT',
    'TZOFFSETFROM:+0100',
    'TZOFFSETTO:+0200',
    'TZNAME:CEST',
    'DTSTART:19700329T020000',
    'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU',
    'END:DAYLIGHT',
    'BEGIN:STANDARD',
    'TZOFFSETFROM:+0200',
    'TZOFFSETTO:+0100',
    'TZNAME:CET',
    'DTSTART:19701025T030000',
    'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU',
    'END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT',
    `UID:rdv-${r.id}@suivi-commercial`,
    `DTSTAMP:${stamp}`,
    `DTSTART;TZID=Europe/Paris:${dateHeureIcs(r.date, r.heure)}`,
    `DTEND;TZID=Europe/Paris:${dateHeureIcs(r.date, r.heure, r.duree)}`,
    `SUMMARY:${echapperIcs(`RDV ${r.client} – ${fam}`)}`,
  ];
  if (r.lieu) lignes.push(`LOCATION:${echapperIcs(r.lieu)}`);
  if (desc) lignes.push(`DESCRIPTION:${echapperIcs(desc)}`);
  lignes.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${echapperIcs('RDV ' + r.client)}`, 'TRIGGER:-PT1H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  return lignes.map(plierIcs).join('\r\n') + '\r\n';
}
function nomFichierIcs(r) { return `rdv-${slug(r.client) || 'client'}-${r.date}.ics`; }
function estStandalone() {
  return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
}
function marquerAjoutAgenda(r) {
  r.agendaAjouteLe = maintenantISO();
  r.agendaSignature = signatureAgenda(r);
  sauver();
}
/** Méthode principale : lien vers un Blob text/calendar. */
function agendaMethodeBlob(r) {
  const blob = new Blob([genererIcs(r)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomFichierIcs(r);
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
/** Méthode de repli : data:text/calendar ouvert dans la page. */
function agendaMethodeData(r) {
  window.location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(genererIcs(r));
}
/** Troisième voie : feuille de partage iOS avec le fichier (Enregistrer dans Fichiers, puis ouvrir). */
async function agendaMethodePartage(r) {
  const fichier = new File([genererIcs(r)], nomFichierIcs(r), { type: 'text/calendar' });
  if (!(navigator.canShare && navigator.canShare({ files: [fichier] }))) { toast('Partage de fichier non disponible ici', 'warn'); return false; }
  try { await navigator.share({ files: [fichier] }); return true; }
  catch (e) { if (e.name !== 'AbortError') toast('Partage impossible', 'bad'); return false; }
}

function feuilleAgenda(id) {
  const r = etat.rdvs.find(x => x.id === id);
  if (!r) return;
  const fam = FAMILLE[r.famille] ? FAMILLE[r.famille].label : '';
  const contenu = `
    ${agendaModifie(r) ? `<div class="form-info warn">${ICONES.alerte}<span>Modifié depuis l'ajout à l'agenda : renvoie-le et supprime l'ancien dans Calendrier.</span></div>` : ''}
    <div class="carte">
      <div class="item-titre">RDV ${esc(r.client)} – ${esc(fam)}</div>
      <div class="kv" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bord)"><span>Date</span><b>${esc(fmtDateLongue(r.date))}</b></div>
      <div class="kv"><span>Horaire</span><b>${esc(r.heure)} → ${dateHeureIcs(r.date, r.heure, r.duree).slice(9, 11)}:${dateHeureIcs(r.date, r.heure, r.duree).slice(11, 13)}</b></div>
      <div class="kv"><span>Fuseau</span><b>Europe/Paris</b></div>
      ${r.lieu ? `<div class="kv"><span>Lieu</span><b>${esc(r.lieu)}</b></div>` : ''}
      <div class="kv"><span>Rappel</span><b>1 h avant</b></div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-prim btn-bloc" data-f="blob">${ICONES.agenda}Ouvrir dans Calendrier</button>
      <button type="button" class="btn btn-sec btn-bloc" data-f="data">Méthode de secours</button>
      <button type="button" class="btn btn-sec btn-bloc" data-f="partage">Partager le fichier .ics</button>
    </div>
    <div class="form-info neutre" style="margin-top:16px">${ICONES.info}<span>Si aucune méthode n'affiche « Ajouter à Calendrier », ouvre l'appli dans Safari (même adresse, hors écran d'accueil) et réessaie.</span></div>
    <div class="actions" style="margin-top:0"><button type="button" class="btn btn-sec btn-bloc" data-f="adresse">Copier l'adresse de l'appli</button></div>`;
  const f = ouvrirFeuille({ titre: "Ajouter à l'agenda", contenu });
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    if (b.dataset.f === 'blob') { marquerAjoutAgenda(r); agendaMethodeBlob(r); rendre(); }
    if (b.dataset.f === 'data') { marquerAjoutAgenda(r); rendre(); agendaMethodeData(r); }
    if (b.dataset.f === 'partage') { if (await agendaMethodePartage(r)) { marquerAjoutAgenda(r); rendre(); } }
    if (b.dataset.f === 'adresse') {
      const ok = await copierTexte(location.origin + location.pathname);
      toast(ok ? 'Adresse copiée : colle-la dans Safari' : 'Copie impossible', ok ? 'ok' : 'bad');
    }
  });
}

/* =====================================================================
   SAUVEGARDE ET RESTAURATION
   ===================================================================== */
function serialiser() {
  return JSON.stringify({
    application: 'suivi-commercial',
    schema: etat.schema,
    version: APP_VERSION,
    exporteLe: maintenantISO(),
    donnees: {
      produits: etat.produits, offres: etat.offres, ventes: etat.ventes,
      distributeurs: etat.distributeurs, rdvs: etat.rdvs,
      reglages: etat.reglages, catalogueConnu: etat.catalogueConnu,
    },
  }, null, 1);
}
function marquerSauvegarde() { R().derniereSauvegarde = maintenantISO(); sauver(); }

async function copierTexte(texte) {
  try { await navigator.clipboard.writeText(texte); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = texte; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, texte.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

async function exporter() {
  const json = serialiser();
  const nom = `suivi-commercial-${aujourdhui()}.json`;
  const fichier = new File([json], nom, { type: 'application/json' });
  // 1. Feuille de partage iOS (Enregistrer dans Fichiers / iCloud Drive)
  if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], title: nom });
      marquerSauvegarde(); toast('Sauvegarde exportée'); rendre();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  // 2. Repli : téléchargement du fichier
  const url = URL.createObjectURL(fichier);
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  marquerSauvegarde(); toast('Fichier de sauvegarde créé'); rendre();
}

/** Valide la structure d'une sauvegarde ; lève une erreur lisible sinon. */
function analyserSauvegarde(texte) {
  let obj;
  try { obj = JSON.parse(String(texte).trim()); }
  catch (e) { throw new Error("Ce n'est pas un fichier JSON valide."); }
  if (!obj || obj.application !== 'suivi-commercial' || typeof obj.donnees !== 'object' || !obj.donnees) {
    throw new Error("Ce fichier n'est pas une sauvegarde de Suivi commercial.");
  }
  if (Number(obj.schema) > SCHEMA_VERSION) throw new Error("Sauvegarde créée par une version plus récente : mets d'abord l'appli à jour.");
  const d = obj.donnees;
  for (const k of ['produits', 'offres', 'ventes', 'distributeurs', 'rdvs']) {
    if (!Array.isArray(d[k])) throw new Error(`Sauvegarde incomplète : « ${k} » manquant.`);
  }
  if (!d.reglages || typeof d.reglages !== 'object') throw new Error('Sauvegarde incomplète : réglages manquants.');
  const docOk = x => x && typeof x.id === 'string' && Array.isArray(x.lignes) && x.lignes.every(l => l && typeof l.produitId === 'string' && typeof l.quantite === 'number' && typeof l.ca === 'number');
  if (!d.offres.every(docOk) || !d.ventes.every(docOk)) throw new Error('Sauvegarde endommagée : offres ou ventes illisibles.');
  if (!d.produits.every(p => p && typeof p.id === 'string' && typeof p.designation === 'string')) throw new Error('Sauvegarde endommagée : catalogue illisible.');
  if (!d.rdvs.every(r => r && typeof r.id === 'string' && dateValide(r.date))) throw new Error('Sauvegarde endommagée : RDV illisibles.');
  if (!d.distributeurs.every(x => x && typeof x.id === 'string' && typeof x.nom === 'string')) throw new Error('Sauvegarde endommagée : distributeurs illisibles.');
  return obj;
}

async function proposerRestauration(texte) {
  let obj;
  try { obj = analyserSauvegarde(texte); }
  catch (e) { await modale({ titre: 'Restauration impossible', message: e.message, boutons: [{ libelle: 'OK', cls: 'btn-prim', valeur: true }] }); return; }
  const d = obj.donnees;
  const html = `<div class="carte" style="box-shadow:none;background:var(--surface-2);margin:10px 0 6px">
      <div class="kv"><span>Date de la sauvegarde</span><b>${fmtDateHeure(obj.exporteLe) || 'inconnue'}</b></div>
      <div class="kv"><span>Offres</span><b>${d.offres.length}</b></div>
      <div class="kv"><span>Ventes</span><b>${d.ventes.length}</b></div>
      <div class="kv"><span>RDV</span><b>${d.rdvs.length}</b></div>
      <div class="kv"><span>Distributeurs</span><b>${d.distributeurs.length}</b></div>
      <div class="kv"><span>Produits</span><b>${d.produits.length}</b></div>
    </div><p>Les données actuelles seront <b>remplacées</b>.</p>`;
  const ok = await modale({ titre: 'Restaurer cette sauvegarde ?', html, boutons: [
    { libelle: 'Remplacer mes données', cls: 'btn-danger-plein', valeur: true },
    { libelle: 'Annuler', cls: 'btn-sec', valeur: false },
  ] });
  if (ok !== true) return;
  const nouvel = migrer(copie({ schema: obj.schema, ...d }));
  synchroniserCatalogue(nouvel);
  nouvel.reglages.derniereSauvegarde = obj.exporteLe || nouvel.reglages.derniereSauvegarde;
  etat = nouvel;
  ui.vue.ancre = null;
  const ecrit = await sauver();
  toast(ecrit ? 'Sauvegarde restaurée' : 'Restaurée, mais enregistrement impossible', ecrit ? 'ok' : 'bad');
  rendre();
}

async function toutEffacer() {
  if (!(await confirmer('Tout effacer ?', 'Offres, ventes, RDV, distributeurs, catalogue modifié et réglages seront supprimés.', 'Continuer', true))) return;
  const v = await modale({
    titre: 'Confirmation définitive',
    message: 'Dernière vérification : cette action ne peut pas être annulée. As-tu exporté une sauvegarde ?',
    boutons: [
      { libelle: 'Effacer définitivement', cls: 'btn-danger-plein', valeur: true },
      { libelle: 'Annuler', cls: 'btn-sec', valeur: false },
    ],
  });
  if (v !== true) return;
  etat = etatInitial();
  ui.vue = { mode: 'objectif', ancre: null };
  await sauver();
  toast('Toutes les données ont été effacées', 'warn');
  allerOnglet('accueil', { haut: true });
}

/* =====================================================================
   MISES À JOUR (service worker + vérification de version)
   ===================================================================== */
let derniereVerif = 0;
async function verifierMiseAJour(manuel = false) {
  if (!manuel && (Date.now() - derniereVerif < 10 * 60 * 1000 || !navigator.onLine)) return;
  derniereVerif = Date.now();
  try {
    const rep = await fetch('./?verif=' + Date.now(), { cache: 'no-store' });
    if (!rep.ok) throw new Error('HTTP ' + rep.status);
    const txt = await rep.text();
    const m = txt.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) toast(`Nouvelle version ${m[1]} disponible`, 'info', { libelle: 'Recharger', fn: () => location.reload() }, 10000);
    else if (manuel) toast(`L'appli est à jour (${APP_VERSION})`);
  } catch (e) {
    if (manuel) toast('Pas de réseau : vérification impossible', 'warn');
  }
}
function enregistrerServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { reg.update().catch(() => {}); verifierMiseAJour(); }
    });
  }).catch(e => console.warn('Service worker non enregistré :', e));
}

/* =====================================================================
   ÉVÉNEMENTS (délégation sur l'appli)
   ===================================================================== */
const ACTIONS = {
  'onglet': el => allerOnglet(el.dataset.id, el.dataset.id === 'plus' ? { plus: null } : {}),
  'filtre-offres': el => { ui.filtreOffres = el.dataset.id; rendre(); },
  'filtre-rdv': el => { ui.filtreRdv = el.dataset.id; rendre(); },
  'vue-mode': el => { ui.vue.mode = el.dataset.id; ui.vue.ancre = null; normaliserAncre(); rendre(); },
  'vue-prec': () => { decalerVue(-1); rendre(); },
  'vue-suiv': () => { decalerVue(1); rendre(); },
  'nouvelle-offre': () => formulaireOffre(),
  'ouvrir-offre': el => formulaireOffre(el.dataset.id),
  'relance': el => relanceFaite(el.dataset.id),
  'nouvelle-vente': () => formulaireVente(),
  'ouvrir-vente': el => formulaireVente(el.dataset.id),
  'nouveau-rdv': () => formulaireRdv(),
  'ouvrir-rdv': el => formulaireRdv(el.dataset.id),
  'rdv-agenda': el => feuilleAgenda(el.dataset.id),
  'aller-relances': () => allerOnglet('offres', { filtreOffres: 'relancer', haut: true }),
  'aller-rdv': () => allerOnglet('rdv', { filtreRdv: 'avenir', haut: true }),
  'aller-sauvegarde': () => allerOnglet('plus', { plus: 'sauvegarde', haut: true }),
  'plus': el => allerOnglet('plus', { plus: el.dataset.id, haut: true }),
  'retour-plus': () => allerOnglet('plus', { plus: null, haut: true }),
  'nouveau-distrib': () => formulaireDistributeur(),
  'ouvrir-distrib': el => formulaireDistributeur(el.dataset.id),
  'nouveau-produit': () => formulaireProduit(),
  'ouvrir-produit': el => formulaireProduit(el.dataset.id),
  'exporter': () => exporter(),
  'copier-json': async () => {
    const ok = await copierTexte(serialiser());
    if (ok) { marquerSauvegarde(); toast('Sauvegarde copiée : colle-la dans Notes ou Fichiers'); rendre(); }
    else toast('Copie impossible', 'bad');
  },
  'restaurer-texte': () => {
    const t = $('#texte-restauration').value;
    if (!t.trim()) { toast('Colle d\'abord le texte de la sauvegarde', 'warn'); return; }
    proposerRestauration(t);
  },
  'tout-effacer': () => toutEffacer(),
  'copier-idees': async () => {
    const t = ($('#idees') || {}).value ?? R().idees;
    if (!t.trim()) { toast('Aucune idée à copier', 'warn'); return; }
    const ok = await copierTexte(t);
    toast(ok ? 'Idées copiées' : 'Copie impossible', ok ? 'ok' : 'bad');
  },
  'verifier-maj': () => verifierMiseAJour(true),
};

const app = $('#app');
app.addEventListener('click', e => {
  if (e.target.closest('.case-fait')) return; // la case « fait » est gérée par l'événement change
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) {
    e.preventDefault();
    e.target.click();
  }
});
app.addEventListener('change', e => {
  if (e.target.matches('[data-change="rdv-fait"]')) {
    const r = etat.rdvs.find(x => x.id === e.target.dataset.id);
    if (!r) return;
    r.fait = e.target.checked;
    r.modifieLe = maintenantISO();
    sauver();
    toast(r.fait ? 'RDV marqué fait' : 'RDV marqué à faire');
    rendre();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pileFeuilles.length && !document.querySelector('.modale-fond')) fermerFeuille(pileFeuilles[pileFeuilles.length - 1]);
});

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function demarrer() {
  await Stockage.init();
  const lu = await Stockage.lire();
  if (!lu.ok) {
    lectureEchouee = true;
    Stockage.ok = false;
    etat = etatInitial();
  } else {
    etat = lu.donnees ? migrer(lu.donnees) : etatInitial();
    synchroniserCatalogue(etat);
  }
  indexer();
  ui.vue.ancre = ancreParDefaut();
  rendre();
  if (!lectureEchouee) await sauver(); // persiste l'état initial et les migrations
  try {
    if (navigator.storage && navigator.storage.persist) {
      persistant = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    }
  } catch (e) { persistant = null; }
  enregistrerServiceWorker();
}

// Accès de débogage (console Safari) : SuiviCommercial.etat
window.SuiviCommercial = {
  get etat() { return etat; },
  version: APP_VERSION,
  calculs: { agregatsVentes, pipeline, transformation, tempsEcoule, rechercherProduits, genererIcs, periodeObjectif },
};

demarrer().catch(e => {
  console.error(e);
  elMain.innerHTML = `<div class="bandeau bad">${ICONES.alerte}<p>Erreur au démarrage<small>${esc(e && e.message)}</small></p></div>`;
});
