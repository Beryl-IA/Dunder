<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi commercial</title>
<meta name="description" content="Suivi de l'activité commerciale : objectifs, offres, ventes, relances, rendez-vous et distributeurs.">
<!-- PWA iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi commercial">
<meta name="theme-color" content="#141c27">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* =====================================================================
   JETONS DE DESIGN (inspirés du système de variables de Gentelella,
   réécrits pour mobile). Clair et sombre sont gérés ici, au même endroit.
   ===================================================================== */
:root {
  color-scheme: light dark;

  /* Encre : bandeau du haut et couleur d'accent (boutons, onglet actif).
     L'accent est volontairement neutre pour laisser les couleurs aux états. */
  --ink: #141c27;
  --ink-bord: #141c27;
  --on-ink: #ffffff;
  --on-ink-doux: #aab6c5;
  --accent: #141c27;
  --on-accent: #ffffff;

  /* Surfaces et texte */
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --bord: #dde2e8;
  --bord-fort: #b9c2cd;
  --texte: #0e1520;
  --texte-2: #364150;
  --doux: #5a6676;
  --neutre-bg: #e9edf2;

  /* Couleurs sémantiques, réservées aux états */
  --ok: #137a3b;      --ok-bg: #e2f4e8;
  --warn: #a35400;    --warn-bg: #fdeed9;
  --bad: #bf1f2a;     --bad-bg: #fde5e6;
  --info: #0a5dbd;    --info-bg: #e1ecfb;

  --focus: #2f7cf6;
  --toast-bg: #141c27;

  /* Rayons et espacements (échelle de 4 px) */
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  --ombre-carte: 0 0 0 1px var(--bord), 0 1px 3px rgba(16, 24, 40, .05);
  --police: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 58px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #121a24;
    --ink-bord: #243040;
    --on-ink-doux: #93a1b2;
    --accent: #e8edf3;
    --on-accent: #0b1017;

    --bg: #0b1017;
    --surface: #151c26;
    --surface-2: #1a2330;
    --bord: #263142;
    --bord-fort: #3b4859;
    --texte: #eef2f6;
    --texte-2: #c3ccd7;
    --doux: #98a4b3;
    --neutre-bg: #222d3b;

    --ok: #4cc77c;      --ok-bg: rgba(76, 199, 124, .16);
    --warn: #f3a650;    --warn-bg: rgba(243, 166, 80, .16);
    --bad: #ff6b70;     --bad-bg: rgba(255, 107, 112, .16);
    --info: #6aaeff;    --info-bg: rgba(106, 174, 255, .16);

    --focus: #6aaeff;
    --toast-bg: #2a3647;
    --ombre-carte: 0 0 0 1px var(--bord), 0 1px 3px rgba(0, 0, 0, .3);
  }
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--ink); }
body {
  font-family: var(--police);
  font-size: 16px;
  line-height: 1.4;
  color: var(--texte);
  background: var(--bg);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  min-height: 100dvh;
}
body.feuille-ouverte { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
button:disabled { cursor: default; opacity: .4; }
svg { flex: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Bandeau du haut ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink); color: var(--on-ink);
  border-bottom: 1px solid var(--ink-bord);
  padding: calc(env(safe-area-inset-top) + 6px) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
}
.topbar-ligne { display: flex; align-items: center; gap: 10px; min-height: 44px; max-width: 640px; margin: 0 auto; }
.topbar-titres { flex: 1; min-width: 0; }
.topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.topbar-sous { font-size: 13px; color: var(--on-ink-doux); }
.btn-topbar {
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  background: rgba(255, 255, 255, .14); color: #fff;
  font-weight: 650; font-size: 15px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn-topbar:active { background: rgba(255, 255, 255, .24); }
.btn-retour { min-height: 44px; min-width: 44px; margin-left: -10px; padding: 0 6px; color: #fff; display: inline-flex; align-items: center; gap: 2px; font-size: 16px; font-weight: 600; }

/* ===== Contenu ===== */
main {
  max-width: 640px; margin: 0 auto;
  padding: 16px calc(16px + env(safe-area-inset-right)) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px) calc(16px + env(safe-area-inset-left));
}
.section { margin-top: 26px; }
.section:first-child { margin-top: 0; }
.section-titre {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .5px;
  color: var(--doux); margin: 0 4px 10px;
}
.section-titre small { font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.lien { color: var(--texte); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; margin: -12px 0; text-decoration: underline; text-underline-offset: 3px; }
.pile > * + * { margin-top: 10px; }

/* Cartes */
.carte { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--ombre-carte); padding: 16px; }
.carte.cliquable { cursor: pointer; }
.carte.cliquable:active { background: var(--surface-2); }

/* Cartes de statistiques (grand chiffre, libellé, variation) */
.stat-label { font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .4px; color: var(--doux); line-height: 1.3; }
.stat-valeur { font-size: 30px; font-weight: 750; letter-spacing: -.6px; line-height: 1.1; }
.stat-valeur small { font-size: 16px; font-weight: 600; color: var(--doux); letter-spacing: 0; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 .stat-valeur { font-size: 23px; margin-top: 2px; }
.stats2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stats2 .stat-valeur { font-size: 24px; margin-top: 2px; }

/* Objectifs */
.obj-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.obj-valeurs { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.obj-pct { margin-left: auto; font-size: 22px; font-weight: 750; }
.obj-pct.ok { color: var(--ok); } .obj-pct.warn { color: var(--warn); } .obj-pct.bad { color: var(--bad); }
.obj-pied { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--texte-2); flex-wrap: wrap; }

/* Barres de progression en CSS pur, avec repère du rythme attendu */
.barre { position: relative; height: 10px; background: var(--neutre-bg); border-radius: 999px; margin: 12px 0 10px; }
.barre-rempli { height: 100%; border-radius: 999px; background: var(--accent); max-width: 100%; transition: width .4s ease; }
.barre.ok .barre-rempli { background: var(--ok); }
.barre.warn .barre-rempli { background: var(--warn); }
.barre.bad .barre-rempli { background: var(--bad); }
.barre-repere { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--texte); border-radius: 2px; box-shadow: 0 0 0 2px var(--surface); }
.barre.fine { height: 6px; margin: 8px 0 0; }

/* Pastilles (badges) */
.pastilles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pastille {
  display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 2px 10px;
  border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap;
  background: var(--neutre-bg); color: var(--texte-2);
}
.pastille.ok { background: var(--ok-bg); color: var(--ok); }
.pastille.warn { background: var(--warn-bg); color: var(--warn); }
.pastille.bad { background: var(--bad-bg); color: var(--bad); }
.pastille.info { background: var(--info-bg); color: var(--info); }
.pastille.contour { background: transparent; box-shadow: inset 0 0 0 1px var(--bord-fort); }

/* Contrôle segmenté */
.segment { display: flex; background: var(--neutre-bg); border-radius: 13px; padding: 3px; gap: 3px; }
.segment > button, .segment > label { flex: 1 1 auto; min-height: 44px; border-radius: 10px; font-weight: 650; font-size: 15px; color: var(--texte-2); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 8px; position: relative; cursor: pointer; }
.segment > button[aria-pressed="true"], .segment > label:has(input:checked) { background: var(--surface); color: var(--texte); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.segment > label input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.segment > label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
.segment .compte { font-size: 13px; color: var(--doux); margin-left: 5px; font-weight: 600; }

/* Sélecteur de période */
.periode { margin-bottom: 18px; }
.periode-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; min-height: 44px; }
.periode-libelle { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.periode-libelle small { display: block; font-size: 13px; color: var(--doux); font-weight: 500; }
.btn-nav { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); box-shadow: var(--ombre-carte); display: flex; align-items: center; justify-content: center; }

/* Boutons */
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-prim { background: var(--accent); color: var(--on-accent); }
.btn-prim:active { opacity: .85; }
.btn-sec { background: var(--surface); color: var(--texte); box-shadow: inset 0 0 0 1px var(--bord-fort); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-danger { background: var(--surface); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.btn-danger-plein { background: var(--bad); color: #fff; }
.btn-bloc { display: flex; width: 100%; }
.btn-petit { min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.btn-icone { width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--texte-2); }
.btn-icone:active { background: var(--neutre-bg); }
.actions { display: grid; gap: 10px; margin-top: 18px; }
.actions.deux { grid-template-columns: 1fr 1fr; }

/* Bandeaux d'alerte */
.bandeau { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-weight: 650; font-size: 15px; margin-bottom: 12px; }
.bandeau p { flex: 1; }
.bandeau p small { display: block; font-weight: 500; font-size: 14px; margin-top: 2px; }
.bandeau.bad { background: var(--bad-bg); color: var(--bad); }
.bandeau.warn { background: var(--warn-bg); color: var(--warn); }
.bandeau.info { background: var(--info-bg); color: var(--info); }
.bandeau .btn { flex: none; min-height: 44px; padding: 0 14px; font-size: 15px; background: var(--surface); color: var(--texte); box-shadow: inset 0 0 0 1px var(--bord-fort); }

/* Lignes clé / valeur et tableaux lisibles */
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--bord); }
.kv:first-child { border-top: 0; padding-top: 0; }
.kv:last-child { padding-bottom: 0; }
.kv > span:first-child { color: var(--texte-2); }
.kv > b, .kv > span:last-child { text-align: right; font-weight: 700; }
.kv small { display: block; color: var(--doux); font-weight: 500; font-size: 13px; }
.tableau { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 15px; }
.tableau th, .tableau td { padding: 9px 0; border-top: 1px solid var(--bord); text-align: right; vertical-align: baseline; }
.tableau th:first-child { text-align: left; font-weight: 650; }
.tableau thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--doux); font-weight: 750; border-top: 0; padding-top: 0; }
.tableau td small { display: block; color: var(--doux); font-size: 13px; }

/* Prévision */
.prev + .prev { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--bord); }
.prev-l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prev-l1 b { font-size: 17px; }
.prev-detail { font-size: 13px; color: var(--doux); margin-top: 2px; }

/* Arbre dépliable Groupe > Famille > Produit */
.arbre { border-top: 1px solid var(--bord); }
.arbre:first-of-type { border-top: 0; }
.arbre summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; cursor: pointer; font-weight: 700; }
.arbre summary::-webkit-details-marker { display: none; }
.arbre summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--doux); border-bottom: 2px solid var(--doux); transform: rotate(-45deg); margin: 0 6px 0 2px; transition: transform .2s; flex: none; }
.arbre[open] > summary::before { transform: rotate(45deg); }
.arbre summary .nom { flex: 1; }
.arbre summary .val { text-align: right; white-space: nowrap; }
.arbre summary .val small { display: block; font-size: 13px; color: var(--doux); font-weight: 500; }
.arbre .arbre { margin-left: 16px; border-top: 1px dashed var(--bord); }
.arbre .arbre summary { font-weight: 650; font-size: 15px; min-height: 44px; }
.arbre ul { list-style: none; margin: 0 0 8px 34px; }
.arbre li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-top: 1px dotted var(--bord); color: var(--texte-2); }
.arbre li span:last-child { white-space: nowrap; font-weight: 650; color: var(--texte); }

/* Répartition direct / distributeurs */
.repart { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--neutre-bg); margin: 10px 0 8px; }
.repart span { display: block; height: 100%; }
.repart .r1 { background: var(--accent); }
.repart .r2 { background: var(--doux); }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--texte-2); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

/* Bloc SAV, volontairement distinct */
.bloc-sav { background: transparent; box-shadow: none; border: 2px dashed var(--bord-fort); }
.bloc-sav .stat-valeur { color: var(--texte-2); }

/* Listes (offres, ventes, RDV) */
.resume { display: flex; gap: 8px 18px; flex-wrap: wrap; margin: 0 4px 12px; color: var(--texte-2); font-size: 15px; }
.resume b { color: var(--texte); }
.item-l1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.item-titre { font-weight: 700; font-size: 17px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.item-id { font-size: 13px; color: var(--doux); font-weight: 550; margin-left: 4px; }
.item-montant { font-weight: 750; font-size: 17px; white-space: nowrap; }
.item-l2 { color: var(--texte-2); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
.item-actions { display: flex; gap: 8px; margin-top: 12px; }
.item-date { font-size: 13px; color: var(--doux); font-weight: 650; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 2px; }

.rdv { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: start; }
.rdv-date { text-align: center; background: var(--neutre-bg); border-radius: 12px; padding: 6px 0 7px; }
.rdv-jour { display: block; font-size: 26px; font-weight: 800; line-height: 1.05; letter-spacing: -.5px; }
.rdv-mois { display: block; font-size: 13px; font-weight: 700; text-transform: uppercase; }
.rdv-sem { display: block; font-size: 12px; color: var(--doux); }
.rdv-heure { font-weight: 700; font-size: 15px; color: var(--texte-2); }
.rdv-actions { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: -6px -8px 0 0; }
.case-fait { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; min-height: 48px; font-size: 12px; font-weight: 650; color: var(--doux); cursor: pointer; }
.case-fait input { width: 24px; height: 24px; accent-color: var(--ok); cursor: pointer; }
.rdv.fait .item-titre { text-decoration: line-through; text-decoration-color: var(--doux); }
.mini-rdv { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bord); }
.mini-rdv:first-child { border-top: 0; padding-top: 0; }
.mini-rdv b { display: block; }
.mini-rdv span { color: var(--texte-2); font-size: 14px; }

/* État vide */
.vide { text-align: center; padding: 36px 20px; color: var(--doux); }
.vide svg { color: var(--bord-fort); margin-bottom: 8px; }
.vide p { margin-bottom: 16px; }
.vide-mini { color: var(--doux); font-size: 15px; }

/* Menu Plus */
.menu { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--ombre-carte); overflow: hidden; }
.menu-ligne { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 8px 14px 8px 16px; border-top: 1px solid var(--bord); text-align: left; }
.menu-ligne:first-child { border-top: 0; }
.menu-ligne:active { background: var(--surface-2); }
.menu-ligne .ico { width: 34px; height: 34px; border-radius: 9px; background: var(--neutre-bg); display: flex; align-items: center; justify-content: center; color: var(--texte-2); }
.menu-ligne .txt { flex: 1; min-width: 0; }
.menu-ligne .txt b { display: block; font-weight: 650; }
.menu-ligne .txt small { display: block; color: var(--doux); font-size: 14px; }
.menu-ligne .chev { color: var(--doux); }

/* Barre d'onglets, au-dessus de la barre d'accueil de l'iPhone */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--bord);
  display: flex; justify-content: center;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar-inner { display: flex; width: 100%; max-width: 640px; }
.tab { flex: 1; min-height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 650; color: var(--doux); position: relative; }
.tab[aria-current="page"] { color: var(--texte); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab-badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 11.5px; font-weight: 750; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--surface); }

/* Feuilles plein écran (formulaires) */
.feuille {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.feuille.ouverte { transform: none; }
.feuille-tete {
  background: var(--ink); color: var(--on-ink); border-bottom: 1px solid var(--ink-bord);
  padding: calc(env(safe-area-inset-top) + 4px) calc(6px + env(safe-area-inset-right)) 6px calc(6px + env(safe-area-inset-left));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
}
.feuille-tete h2 { font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.btn-texte { justify-self: start; min-height: 44px; padding: 0 10px; color: #fff; font-size: 16px; font-weight: 500; }
.feuille-corps { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* =====================================================================
   OUTILS : texte, dates, nombres
   ===================================================================== */
const $ = (sel, racine = document) => racine.querySelector(sel);
const $$ = (sel, racine = document) => Array.from(racine.querySelectorAll(sel));
const pad = n => String(n).padStart(2, '0');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* contexte non sécurisé */ }
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
}
function copie(o) {
  try { return structuredClone(o); } catch (e) { return JSON.parse(JSON.stringify(o)); }
}
function maintenantISO() { return new Date().toISOString(); }
/** Normalise pour la recherche : minuscules, sans accents. */
function norm(s) { return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function capital(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// Dates : on manipule des chaînes 'AAAA-MM-JJ' (heure locale du téléphone)
function isoLocal(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function aujourdhui() { return isoLocal(); }
function versUTC(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function depuisUTC(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function ajouterJours(iso, n) { return depuisUTC(versUTC(iso) + n * 86400000); }
function ecartJours(a, b) { return Math.round((versUTC(b) - versUTC(a)) / 86400000); } // b − a
function finDeMois(y, m) { return depuisUTC(Date.UTC(y, m, 0)); } // m de 1 à 12
function dateValide(iso) { return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && !isNaN(versUTC(iso)); }
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtJJMM(iso) { if (!iso) return ''; const [, m, d] = iso.split('-'); return `${d}/${m}`; }
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_COURT = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
function jourSemaine(iso) { return new Date(versUTC(iso)).getUTCDay(); }
function fmtDateLongue(iso) { const [y, m, d] = iso.split('-').map(Number); return `${capital(JOURS[jourSemaine(iso)])} ${d} ${MOIS[m - 1]} ${y}`; }
function fmtDateHeure(isoComplet) {
  if (!isoComplet) return '';
  const d = new Date(isoComplet);
  if (isNaN(d)) return '';
  return `${fmtDate(isoLocal(d))} à ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function libelleDuree(min) { const d = DUREES.find(x => x.v === min); return d ? d.l.replace(/ \(.*\)/, '') : `${min} min`; }

// Nombres au format français
const NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NBSP = '\u00a0';
/** Montant arrondi à l'euro : « 12 500 € » */
function eur(n) { return NF0.format(Math.round(n || 0)) + NBSP + '€'; }
/** Montant exact (centimes si besoin) */
function eurExact(n) { n = n || 0; return (Number.isInteger(n) ? NF0.format(n) : NF2.format(n)) + NBSP + '€'; }
/** Format compact du tableau de bord : « 128 k€ » */
function eurCompact(n) {
  n = n || 0; const a = Math.abs(n);
  if (a >= 1e6) return NF1.format(n / 1e6) + NBSP + 'M€';
  if (a >= 100000) return NF0.format(Math.round(n / 1000)) + NBSP + 'k€';
  if (a >= 1000) return NF1.format(Math.round(n / 100) / 10) + NBSP + 'k€';
  return eur(n);
}
function pct(x) { return NF0.format(Math.round((x || 0) * 100)) + NBSP + '%'; }
function nb1(x) { return NF1.format(Math.round((x || 0) * 10) / 10); }
function pluriel(n, mot, motPluriel) { return `${n} ${n > 1 ? (motPluriel || mot + 's') : mot}`; }
function points(n) { return `${n} point${n > 1 ? 's' : ''}`; }

/** Lit un montant saisi : « 12500,50 », « 12 500 », « 12500.5 ». Renvoie NaN si invalide. */
function parseMontant(t) {
  if (t == null) return NaN;
  const s = String(t).replace(/[\s\u00a0\u202f€]/g, '').replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100) / 100;
}
function parseEntier(t) {
  const s = String(t ?? '').trim();
  return /^\d+$/.test(s) ? parseInt(s, 10) : NaN;
}
function versSaisie(n) { return n == null ? '' : String(n).replace('.', ','); }

/* =====================================================================
   CATALOGUE : lecture de la constante
   ===================================================================== */
const CATALOGUE_PRODUITS = (() => {
  const liste = [];
  let famille = null;
  for (const brut of CATALOGUE.split('\n')) {
    const l = brut.trim();
    if (!l) continue;
    if (l.startsWith('#')) { famille = l.slice(1).trim(); continue; }
    const i = l.indexOf('|');
    const code = l.slice(0, i).trim() === '-' ? '' : l.slice(0, i).trim();
    const designation = l.slice(i + 1).trim();
    // Clé stable : le code article, ou la désignation pour les produits sans code
    liste.push({ cle: code || 'sans-code-' + slug(designation), code, designation, famille });
  }
  return liste;
})();

/* =====================================================================
   STOCKAGE (IndexedDB, repli localStorage, sinon mémoire + alerte)
   ===================================================================== */
const Stockage = {
  mode: 'memoire',   // 'idb' | 'local' | 'memoire'
  ok: true,          // passe à false si une écriture échoue
  erreur: null,
  db: null,

  async init() {
    try {
      if (!('indexedDB' in window) || !window.indexedDB) throw new Error('IndexedDB absent');
      this.db = await Promise.race([
        new Promise((res, rej) => {
          const req = indexedDB.open(CLE_STOCKAGE, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('donnees')) db.createObjectStore('donnees');
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
          req.onblocked = () => rej(new Error('Ouverture bloquée'));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé')), 4000)),
      ]);
      this.db.onversionchange = () => { try { this.db.close(); } catch (e) { /* rien */ } };
      this.mode = 'idb';
      return;
    } catch (e) {
      console.warn('IndexedDB indisponible :', e);
    }
    try {
      localStorage.setItem('__test__', '1');
      localStorage.removeItem('__test__');
      this.mode = 'local';
    } catch (e) {
      this.mode = 'memoire';
      this.ok = false;
      this.erreur = e;
    }
  },

  /** Renvoie { ok, donnees } : ok=false signifie que la lecture a échoué (ne rien écraser). */
  async lire() {
    try {
      if (this.mode === 'idb') {
        const donnees = await new Promise((res, rej) => {
          const tx = this.db.transaction('donnees', 'readonly');
          const req = tx.objectStore('donnees').get('etat');
          req.onsuccess = () => res(req.result ?? null);
          req.onerror = () => rej(req.error);
        });
        return { ok: true, donnees };
      }
      if (this.mode === 'local') {
        const brut = localStorage.getItem(CLE_STOCKAGE);
        return { ok: true, donnees: brut ? JSON.parse(brut) : null };
      }
      return { ok: true, donnees: null };
    } catch (e) {
      console.error('Lecture impossible :', e);
      this.erreur = e;
      return { ok: false, donnees: null };
    }
  },

  async ecrire(etatAEcrire) {
    try {
      if (this.mode === 'idb') {
        return await new Promise(res => {
          try {
            const tx = this.db.transaction('donnees', 'readwrite');
            tx.objectStore('donnees').put(etatAEcrire, 'etat');
            tx.oncomplete = () => res(true);
            tx.onerror = tx.onabort = () => { this.erreur = tx.error; res(false); };
          } catch (e) { this.erreur = e; res(false); }
        });
      }
      if (this.mode === 'local') {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(etatAEcrire));
        return true;
      }
      return false;
    } catch (e) {
      console.error('Écriture impossible :', e);
      this.erreur = e;
      return false;
    }
  },
};

/* =====================================================================
   ÉTAT, MIGRATIONS ET SAUVEGARDE LOCALE
   ===================================================================== */
let etat = null;               // toutes les données de l'appli
let produitsParId = new Map(); // index pour retrouver un produit
let lectureEchouee = false;    // si vrai, on n'écrit jamais (pour ne rien écraser)
let persistant = null;         // résultat de navigator.storage.persist()

function etatInitial() {
  const e = {
    schema: SCHEMA_VERSION,
    produits: [], offres: [], ventes: [], distributeurs: [], rdvs: [],
    reglages: copie(REGLAGES_DEFAUT),
    catalogueConnu: [],
  };
  synchroniserCatalogue(e);
  return e;
}

/**
 * Migrations du schéma. Chaque entrée transforme les données de la
 * version N vers N+1. Exemple pour une future v2 :
 *   1: e => { e.offres.forEach(o => { o.numeroErp = ''; }); },
 */
const MIGRATIONS = {};

function migrer(e) {
  if (!e || typeof e !== 'object') return etatInitial();
  let v = Number(e.schema) || 1;
  while (v < SCHEMA_VERSION) {
    if (MIGRATIONS[v]) MIGRATIONS[v](e);
    v++;
  }
  e.schema = Math.max(v, Number(e.schema) || 1);
  // Robustesse : compléter ce qui manquerait
  for (const k of ['produits', 'offres', 'ventes', 'distributeurs', 'rdvs', 'catalogueConnu']) {
    if (!Array.isArray(e[k])) e[k] = [];
  }
  const r = (e.reglages && typeof e.reglages === 'object') ? e.reglages : {};
  e.reglages = Object.assign(copie(REGLAGES_DEFAUT), r);
  e.reglages.cibles = Object.assign(copie(REGLAGES_DEFAUT.cibles), r.cibles || {});
  return e;
}

/**
 * Ajoute au stockage les produits du catalogue jamais vus. Un produit déjà
 * présent (même code) ou déjà importé une fois (même clé, même s'il a été
 * modifié ou supprimé depuis) n'est jamais touché.
 */
function synchroniserCatalogue(e) {
  const connus = new Set(e.catalogueConnu);
  const codes = new Set(e.produits.map(p => norm(p.code).trim()).filter(Boolean));
  const ids = new Set(e.produits.map(p => p.id));
  const t = maintenantISO();
  let ajoutes = 0;
  for (const item of CATALOGUE_PRODUITS) {
    if (connus.has(item.cle)) continue;
    connus.add(item.cle);
    if (item.code && codes.has(norm(item.code))) continue;
    const id = 'cat-' + item.cle;
    if (ids.has(id)) continue;
    e.produits.push({
      id, code: item.code, designation: item.designation, famille: item.famille,
      actif: true, catalogueCle: item.cle, creeLe: t, modifieLe: t,
    });
    ajoutes++;
  }
  e.catalogueConnu = Array.from(connus);
  return ajoutes;
}

function indexer() { produitsParId = new Map(etat.produits.map(p => [p.id, p])); }

let fileEcriture = Promise.resolve(true);
/** Enregistre l'état complet (écritures mises en file, jamais en parallèle). */
function sauver() {
  indexer();
  if (lectureEchouee) return Promise.resolve(false);
  fileEcriture = fileEcriture.then(() => Stockage.ecrire(etat)).then(ok => {
    const avant = Stockage.ok;
    Stockage.ok = ok;
    if (avant !== ok) rendre();
    return ok;
  });
  return fileEcriture;
}

const R = () => etat.reglages;

/* =====================================================================
   RÈGLES MÉTIER ET CALCULS
   ===================================================================== */
function produit(id) { return produitsParId.get(id) || null; }
function familleDe(produitId) { const p = produit(produitId); return p ? p.famille : null; }
function groupeDe(familleId) { return FAMILLE[familleId] ? FAMILLE[familleId].groupe : null; }
/** Règle SAV : affaire « SAV » OU produit du groupe SAV. */
function estLigneSAV(doc, ligne) { return doc.affaire === 'SAV' || groupeDe(familleDe(ligne.produitId)) === 'sav'; }
function totalDoc(doc) { return doc.lignes.reduce((s, l) => s + l.ca, 0); }
function caCommercialDoc(doc) { return doc.lignes.reduce((s, l) => s + (estLigneSAV(doc, l) ? 0 : l.ca), 0); }
function aDesLignesCommerciales(doc) { return doc.lignes.some(l => !estLigneSAV(doc, l)); }
function aDesLignesSAV(doc) { return doc.lignes.some(l => estLigneSAV(doc, l)); }
function produitPrincipal(doc) {
  if (!doc.lignes.length) return '';
  const l = doc.lignes.reduce((a, b) => (b.ca > a.ca ? b : a));
  const p = produit(l.produitId);
  return p ? p.designation : 'Produit supprimé';
}
function metaProduit(p) { return [p.code, FAMILLE[p.famille] ? FAMILLE[p.famille].label : ''].filter(Boolean).join(' · '); }
function distributeur(id) { return etat.distributeurs.find(d => d.id === id) || null; }
function libelleCanal(v) {
  if (!v.canal || v.canal === 'direct') return 'Direct';
  const d = distributeur(v.canal);
  return d ? d.nom : 'Distributeur supprimé';
}

// Périodes
function periodeObjectif() { return { debut: R().debut, fin: R().fin }; }
function joursPeriode(p) { return ecartJours(p.debut, p.fin) + 1; }
function dansPeriode(iso, p) { return !!iso && iso >= p.debut && iso <= p.fin; }
function intersection(a, b) {
  const debut = a.debut > b.debut ? a.debut : b.debut;
  const fin = a.fin < b.fin ? a.fin : b.fin;
  return debut <= fin ? { debut, fin } : null;
}
/** % de temps écoulé de la période d'objectif (jour en cours compris), borné entre 0 et 1. */
function tempsEcoule() {
  const p = periodeObjectif();
  const total = joursPeriode(p);
  const ecoules = clamp(ecartJours(p.debut, aujourdhui()) + 1, 0, total);
  return total > 0 ? ecoules / total : 0;
}

/** Agrège les ventes d'une période (les lignes SAV sont comptées à part). */
function agregatsVentes(p) {
  const r = {
    negoce: 0, treuil: 0, rec: 0,
    caCommercial: 0, nbVentes: 0, nbVentesCom: 0,
    caDirect: 0, caDistrib: 0, parDistrib: new Map(),
    caSav: 0, nbSav: 0,
    parGroupe: {}, // groupe -> { ca, qte, familles: { famille -> { ca, qte, produits: Map(id -> {ca, qte}) } } }
  };
  for (const v of etat.ventes) {
    if (!dansPeriode(v.date, p)) continue;
    r.nbVentes++;
    let caCom = 0, com = false, sav = false;
    for (const l of v.lignes) {
      if (estLigneSAV(v, l)) { sav = true; r.caSav += l.ca; continue; }
      com = true;
      caCom += l.ca;
      const fam = familleDe(l.produitId);
      const g = groupeDe(fam);
      if (g === 'negoce') r.negoce += l.ca;
      if (fam === 'treuil') r.treuil += l.quantite;
      if (fam === 'rec') r.rec += l.quantite;
      if (g) {
        const G = r.parGroupe[g] || (r.parGroupe[g] = { ca: 0, qte: 0, familles: {} });
        const F = G.familles[fam] || (G.familles[fam] = { ca: 0, qte: 0, produits: new Map() });
        const P = F.produits.get(l.produitId) || { ca: 0, qte: 0 };
        G.ca += l.ca; G.qte += l.quantite;
        F.ca += l.ca; F.qte += l.quantite;
        P.ca += l.ca; P.qte += l.quantite;
        F.produits.set(l.produitId, P);
      }
    }
    if (com) {
      r.nbVentesCom++;
      r.caCommercial += caCom;
      if (!v.canal || v.canal === 'direct') r.caDirect += caCom;
      else {
        r.caDistrib += caCom;
        r.parDistrib.set(v.canal, (r.parDistrib.get(v.canal) || 0) + caCom);
      }
    }
    if (sav) r.nbSav++;
  }
  return r;
}

/** Pipeline des offres en cours, hors SAV (et compteurs SAV à part). */
function pipeline() {
  const r = {
    nb: 0, brut: 0, pondere: 0,
    machineCa: 0, machineQte: 0, machinePond: 0,
    negoceCa: 0, negocePond: 0,
    prevNegoce: 0, prevTreuil: 0, prevRec: 0,
    savNb: 0, savCa: 0,
  };
  for (const o of etat.offres) {
    if (o.statut !== 'en_cours') continue;
    const ch = (o.chance || 0) / 100;
    let com = false, sav = false;
    for (const l of o.lignes) {
      if (estLigneSAV(o, l)) { sav = true; r.savCa += l.ca; continue; }
      com = true;
      r.brut += l.ca; r.pondere += l.ca * ch;
      const fam = familleDe(l.produitId);
      const g = groupeDe(fam);
      if (g === 'machine') { r.machineCa += l.ca; r.machineQte += l.quantite; r.machinePond += l.ca * ch; }
      if (g === 'negoce') { r.negoceCa += l.ca; r.negocePond += l.ca * ch; r.prevNegoce += l.ca * ch; }
      if (fam === 'treuil') r.prevTreuil += l.quantite * ch;
      if (fam === 'rec') r.prevRec += l.quantite * ch;
    }
    if (com) r.nb++;
    if (sav) r.savNb++;
  }
  return r;
}

/** Taux de transformation des offres clôturées dans la période (hors SAV). */
function transformation(p) {
  let g = 0, pe = 0, caG = 0, caP = 0;
  for (const o of etat.offres) {
    if (o.statut === 'en_cours' || !dansPeriode(o.dateCloture, p) || !aDesLignesCommerciales(o)) continue;
    const ca = caCommercialDoc(o);
    if (o.statut === 'gagnee') { g++; caG += ca; } else { pe++; caP += ca; }
  }
  return { g, pe, caG, caP, tauxNb: g + pe ? g / (g + pe) : null, tauxCa: caG + caP ? caG / (caG + caP) : null };
}

/** État de la relance d'une offre (pastille colorée). */
function etatRelance(o) {
  if (!o.relanceManuelle || !o.dateRelance) return { code: 'auto', libelle: 'Auto (ERP)', cls: '' };
  const t = aujourdhui();
  if (o.dateRelance < t) return { code: 'retard', libelle: `En retard (${fmtJJMM(o.dateRelance)})`, cls: 'bad' };
  if (o.dateRelance === t) return { code: 'jour', libelle: "Aujourd'hui", cls: 'warn' };
  return { code: 'avenir', libelle: 'Le ' + fmtJJMM(o.dateRelance), cls: 'info' };
}
function relancesDues() {
  const t = aujourdhui();
  return etat.offres.filter(o => o.statut === 'en_cours' && o.relanceManuelle && o.dateRelance && o.dateRelance <= t);
}

// RDV et agenda
function signatureAgenda(r) { return JSON.stringify([r.date, r.heure, r.duree, r.client, r.idClient, r.famille, r.produitId, r.lieu]); }
function agendaModifie(r) { return !!r.agendaAjouteLe && r.agendaSignature !== signatureAgenda(r); }

function sauvegardeAFaire() {
  const nb = etat.offres.length + etat.ventes.length + etat.rdvs.length + etat.distributeurs.length;
  if (!nb) return false;
  const d = R().derniereSauvegarde;
  if (!d) return true;
  return Date.now() - Date.parse(d) >= RAPPEL_SAUVEGARDE_JOURS * 86400000;
}

/* =====================================================================
   ÉTAT DE L'INTERFACE ET PÉRIODE AFFICHÉE
   ===================================================================== */
const ui = {
  onglet: 'accueil',
  filtreOffres: 'en_cours',  // en_cours | relancer | closes
  filtreRdv: 'avenir',       // avenir | passes
  vue: { mode: 'objectif', ancre: null }, // ancre = 1er jour du mois ou du trimestre affiché
  plus: null,                // sous-écran de l'onglet Plus
  cat: { q: '', famille: '' },
};

function ancreParDefaut() {
  const po = periodeObjectif();
  let t = aujourdhui();
  if (t < po.debut) t = po.debut;
  if (t > po.fin) t = po.fin;
  return t.slice(0, 8) + '01';
}
function normaliserAncre() {
  if (!ui.vue.ancre) ui.vue.ancre = ancreParDefaut();
  if (ui.vue.mode === 'trimestre') {
    const [y, m] = ui.vue.ancre.split('-').map(Number);
    ui.vue.ancre = `${y}-${pad(Math.floor((m - 1) / 3) * 3 + 1)}-01`;
  }
}
function periodeSelectionnee() {
  if (ui.vue.mode === 'objectif') return { ...periodeObjectif(), libelle: "Période d'objectif" };
  normaliserAncre();
  const [y, m] = ui.vue.ancre.split('-').map(Number);
  if (ui.vue.mode === 'mois') {
    return { debut: `${y}-${pad(m)}-01`, fin: finDeMois(y, m), libelle: `${capital(MOIS[m - 1])} ${y}` };
  }
  const q = Math.floor((m - 1) / 3);
  const m1 = q * 3 + 1;
  return { debut: `${y}-${pad(m1)}-01`, fin: finDeMois(y, m1 + 2), libelle: `T${q + 1} ${y}`, sous: `${MOIS_COURT[m1 - 1]} – ${MOIS_COURT[m1 + 1]}` };
}
function decalerVue(sens) {
  const [y, m] = ui.vue.ancre.split('-').map(Number);
  const pas = ui.vue.mode === 'trimestre' ? 3 : 1;
  ui.vue.ancre = depuisUTC(Date.UTC(y, m - 1 + sens * pas, 1));
}
/** Bornes de navigation : la période d'objectif, élargie aux ventes saisies hors période. */
function bornesNavigation() {
  const po = periodeObjectif();
  let min = po.debut, max = po.fin;
  const t = aujourdhui();
  if (t < min) min = t;
  if (t > max) max = t;
  for (const v of etat.ventes) { if (v.date < min) min = v.date; if (v.date > max) max = v.date; }
  return { min, max };
}
function peutDecaler(sens) {
  if (ui.vue.mode === 'objectif') return false;
  const sauve = ui.vue.ancre;
  decalerVue(sens);
  const p = periodeSelectionnee();
  ui.vue.ancre = sauve;
  const b = bornesNavigation();
  return sens < 0 ? p.fin >= b.min : p.debut <= b.max;
}

/* =====================================================================
   RENDU GÉNÉRAL
   ===================================================================== */
const elTopbar = $('#topbar');
const elMain = $('#main');
const elTabbar = $('#tabbar');

function entete(titre, { sous = '', action = '', retour = null } = {}) {
  return `<div class="topbar-ligne">
    ${retour ? `<button class="btn-retour" data-action="${retour.action}" aria-label="Retour : ${esc(retour.label)}">${ICONES.chevG}<span>${esc(retour.label)}</span></button>` : ''}
    <div class="topbar-titres"><h1>${esc(titre)}</h1>${sous ? `<div class="topbar-sous">${esc(sous)}</div>` : ''}</div>
    ${action}
  </div>`;
}
function boutonAjout(action, libelle) {
  return `<button class="btn-topbar" data-action="${action}">${ICONES.ajout}<span>${esc(libelle)}</span></button>`;
}

function barreOnglets() {
  const dues = relancesDues().length;
  return `<div class="tabbar-inner">${ONGLETS.map(o => `
    <button class="tab" data-action="onglet" data-id="${o.id}" ${ui.onglet === o.id ? 'aria-current="page"' : ''} aria-label="${esc(o.label)}${o.id === 'offres' && dues ? `, ${dues} relance${dues > 1 ? 's' : ''} à faire` : ''}">
      ${ICONES[o.id]}<span>${esc(o.label)}</span>
      ${o.id === 'offres' && dues ? `<span class="tab-badge" aria-hidden="true">${dues > 99 ? '99+' : dues}</span>` : ''}
    </button>`).join('')}</div>`;
}

function bandeauStockage() {
  if (lectureEchouee) {
    return `<div class="bandeau bad" role="alert">${ICONES.alerte}<p>Lecture des données impossible<small>Rien n'a été écrasé. Ferme complètement l'appli puis rouvre-la. Les modifications faites maintenant ne seront pas enregistrées.</small></p></div>`;
  }
  if (!Stockage.ok) {
    return `<div class="bandeau bad" role="alert">${ICONES.alerte}<p>Stockage indisponible<small>Les données ne sont pas enregistrées sur l'iPhone. Vérifie que la navigation privée est désactivée, puis exporte une sauvegarde.</small></p></div>`;
  }
  return '';
}

function rendre() {
  if (!etat) return;
  const ecrans = { accueil: ecranAccueil, offres: ecranOffres, ventes: ecranVentes, rdv: ecranRdv, plus: ecranPlus };
  const r = ecrans[ui.onglet]();
  elTopbar.innerHTML = r.entete;
  elMain.innerHTML = (ui.onglet !== 'accueil' ? bandeauStockage() : '') + r.corps;
  elTabbar.innerHTML = barreOnglets();
  if (r.apres) r.apres();
}

function allerOnglet(id, options = {}) {
  const avant = ui.onglet + '/' + ui.plus;
  ui.onglet = id;
  if ('plus' in options) ui.plus = options.plus;
  const change = avant !== ui.onglet + '/' + ui.plus;
  if (options.filtreOffres) ui.filtreOffres = options.filtreOffres;
  if (options.filtreRdv) ui.filtreRdv = options.filtreRdv;
  rendre();
  if (change || options.haut) window.scrollTo(0, 0);
}

function etatVide(message, action, libelle) {
  return `<div class="vide carte">${ICONES.vide}<p>${esc(message)}</p>${action ? `<button class="btn btn-prim" data-action="${action}">${ICONES.ajout}${esc(libelle)}</button>` : ''}</div>`;
}

function selecteurPeriode() {
  const m = ui.vue.mode;
  const sel = periodeSelectionnee();
  const b = (id, l) => `<button type="button" data-action="vue-mode" data-id="${id}" aria-pressed="${m === id}">${l}</button>`;
  let nav;
  if (m === 'objectif') {
    nav = `<span class="periode-libelle">${fmtDate(sel.debut)} → ${fmtDate(sel.fin)}<small>${joursPeriode(sel)} jours · ${pct(tempsEcoule())} écoulés</small></span>`;
  } else {
    nav = `<button class="btn-nav" data-action="vue-prec" ${peutDecaler(-1) ? '' : 'disabled'} aria-label="Période précédente">${ICONES.chevG2}</button>
      <span class="periode-libelle" aria-live="polite">${esc(sel.libelle)}${sel.sous ? `<small>${esc(sel.sous)}</small>` : `<small>${fmtDate(sel.debut)} → ${fmtDate(sel.fin)}</small>`}</span>
      <button class="btn-nav" data-action="vue-suiv" ${peutDecaler(1) ? '' : 'disabled'} aria-label="Période suivante">${ICONES.chevD}</button>`;
  }
  return `<div class="periode"><div class="segment" role="group" aria-label="Période affichée">${b('objectif', "Période d'objectif")}${b('trimestre', 'Trimestre')}${b('mois', 'Mois')}</div><div class="periode-nav">${nav}</div></div>`;
}

/* =====================================================================
   ÉCRAN ACCUEIL (tableau de bord)
   ===================================================================== */
function ecranAccueil() {
  const sel = periodeSelectionnee();
  let h = '';
  // 1. Bandeaux d'alerte
  h += bandeauStockage();
  if (sauvegardeAFaire()) {
    const d = R().derniereSauvegarde;
    h += `<div class="bandeau warn" role="status">${ICONES.alerte}<p>Sauvegarde à faire<small>${d ? `Dernière sauvegarde le ${fmtDate(isoLocal(new Date(d)))}.` : 'Aucune sauvegarde pour l\'instant.'} Les données n'existent que sur cet iPhone.</small></p><button class="btn" data-action="aller-sauvegarde">Sauvegarder</button></div>`;
  }
  h += selecteurPeriode();
  h += sectionObjectifs(sel);
  h += sectionPipeline();
  h += sectionRelances();
  h += sectionPrevision();
  h += sectionVentesFamilles(sel);
  h += sectionDistributeurs(sel);
  h += sectionKpi(sel);
  h += sectionProchainsRdv(sel);
  h += sectionSav(sel);
  return {
    entete: entete('Suivi commercial', { sous: fmtDateLongue(aujourdhui()) }),
    corps: h,
  };
}

function formatObjectif(def, v) {
  if (def.unite === 'eur') return eurCompact(v);
  return nb1(v);
}
function uniteObjectif(def, n) {
  if (def.unite === 'eur') return '';
  if (def.unite === 'contrats') return n > 1 ? 'contrats' : 'contrat';
  return n > 1 ? 'unités' : 'unité';
}

function sectionObjectifs(sel) {
  const po = periodeObjectif();
  const mode = ui.vue.mode;
  let periodeCalc = po, facteur = 1, lisse = false, hors = false;
  if (mode !== 'objectif') {
    const inter = intersection(sel, po);
    if (!inter) { hors = true; periodeCalc = sel; facteur = 0; }
    else { periodeCalc = inter; facteur = joursPeriode(inter) / joursPeriode(po); lisse = true; }
  }
  const a = agregatsVentes(periodeCalc);
  const contrats = etat.distributeurs.filter(d => dansPeriode(d.dateSignature, periodeCalc)).length;
  const realises = { negoce: a.negoce, treuil: a.treuil, rec: a.rec, distrib: contrats };
  const temps = tempsEcoule();
  const cartes = OBJECTIFS.map(def => carteObjectif(def, realises[def.id], (R().cibles[def.id] || 0) * facteur, { lisse, hors, temps })).join('');
  const sous = mode === 'objectif' ? `Rythme attendu : ${pct(temps)}` : (hors ? 'Hors période' : 'Objectif lissé indicatif');
  return `<section class="section" aria-labelledby="t-obj"><h2 class="section-titre" id="t-obj">Réussite des objectifs <small>${esc(sous)}</small></h2><div class="pile">${cartes}</div></section>`;
}

function carteObjectif(def, realise, cible, { lisse, hors, temps }) {
  const taux = cible > 0 ? realise / cible : 0;
  const reste = Math.max(cible - realise, 0);
  let cls = '', message = '';
  if (!lisse && !hors) {
    const delta = Math.round((taux - temps) * 100);
    if (taux >= 1) { cls = 'ok'; message = 'Objectif atteint'; }
    else if (delta >= 0) { cls = 'ok'; message = delta === 0 ? 'Dans le rythme' : `En avance de ${points(delta)}`; }
    else if (delta > -10) { cls = 'warn'; message = `En retard de ${points(-delta)}`; }
    else { cls = 'bad'; message = `En retard de ${points(-delta)}`; }
  }
  const largeur = clamp(taux * 100, 0, 100);
  const cibleTxt = formatObjectif(def, cible);
  const unite = uniteObjectif(def, cible);
  let pied;
  if (hors) pied = `<span>Hors période d'objectif : pas de cible</span>`;
  else if (lisse) pied = `<span>Cible lissée : ${cibleTxt}${unite ? ' ' + unite : ''}</span><span>Reste : ${formatObjectif(def, reste)}</span>`;
  else pied = `<span>Reste à faire : <b>${formatObjectif(def, reste)}</b>${unite && def.unite !== 'eur' ? ' ' + uniteObjectif(def, reste) : ''}</span><span>Attendu : ${pct(temps)}</span>`;
  return `<article class="carte obj" aria-label="Objectif ${esc(def.label)}">
    <div class="obj-tete"><span class="stat-label">${esc(def.label)}${def.unite === 'unites' ? ' (u)' : def.unite === 'eur' ? ' (€)' : ''}</span>${message ? `<span class="pastille ${cls}">${esc(message)}</span>` : (lisse ? '<span class="pastille contour">lissé</span>' : '')}</div>
    <div class="obj-valeurs"><span class="stat-valeur">${formatObjectif(def, realise)} ${hors ? '' : `<small>/ ${cibleTxt}${lisse ? ' lissé' : ''}</small>`}</span>${hors ? '' : `<span class="obj-pct ${cls}">${pct(taux)}</span>`}</div>
    ${hors ? '' : `<div class="barre ${cls}" role="progressbar" aria-label="Avancement ${esc(def.label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(taux * 100)}">
      <div class="barre-rempli" style="width:${largeur}%"></div>
      ${!lisse ? `<div class="barre-repere" style="left:${clamp(temps * 100, 0, 100)}%" title="Rythme attendu"></div>` : ''}
    </div>`}
    <div class="obj-pied">${pied}</div>
  </article>`;
}

function sectionPipeline() {
  const p = pipeline();
  return `<section class="section" aria-labelledby="t-pipe"><h2 class="section-titre" id="t-pipe">Offres en cours <small>hors SAV</small></h2>
    <div class="carte">
      <div class="stats3">
        <div><div class="stat-label">Offres</div><div class="stat-valeur">${p.nb}</div></div>
        <div><div class="stat-label">CA brut</div><div class="stat-valeur">${eurCompact(p.brut)}</div></div>
        <div><div class="stat-label">Pondéré</div><div class="stat-valeur">${eurCompact(p.pondere)}</div></div>
      </div>
      <table class="tableau">
        <thead><tr><th scope="col">Groupe</th><th scope="col">Brut</th><th scope="col">Pondéré</th></tr></thead>
        <tbody>
          <tr><th scope="row">Machine</th><td>${eurCompact(p.machineCa)}<small>${pluriel(p.machineQte, 'unité')}</small></td><td>${eurCompact(p.machinePond)}</td></tr>
          <tr><th scope="row">Négoce</th><td>${eurCompact(p.negoceCa)}</td><td>${eurCompact(p.negocePond)}</td></tr>
        </tbody>
      </table>
    </div></section>`;
}

function sectionRelances() {
  const dues = relancesDues();
  const retard = dues.filter(o => o.dateRelance < aujourdhui()).length;
  const cls = retard ? 'bad' : dues.length ? 'warn' : 'ok';
  return `<section class="section" aria-labelledby="t-rel"><h2 class="section-titre" id="t-rel">Relances à faire</h2>
    <div class="carte cliquable" role="button" tabindex="0" data-action="aller-relances" aria-label="Voir les offres à relancer">
      <div class="item-l1"><div><span class="stat-valeur">${dues.length}</span> <span class="item-l2">${dues.length > 1 ? 'relances manuelles dues' : 'relance manuelle due'}</span></div>${ICONES.chevD}</div>
      <div class="pastilles"><span class="pastille ${cls}">${retard ? `dont ${retard} en retard` : dues.length ? 'aucune en retard' : 'tout est à jour'}</span></div>
    </div></section>`;
}

function sectionPrevision() {
  const po = periodeObjectif();
  const a = agregatsVentes(po);
  const p = pipeline();
  const lignes = [
    { def: OBJECTIFS[0], r: a.negoce, pond: p.prevNegoce, f: eurCompact },
    { def: OBJECTIFS[1], r: a.treuil, pond: p.prevTreuil, f: nb1 },
    { def: OBJECTIFS[2], r: a.rec, pond: p.prevRec, f: nb1 },
  ];
  return `<section class="section" aria-labelledby="t-prev"><h2 class="section-titre" id="t-prev">Prévision <small>réalisé + pondéré, fin de période</small></h2>
    <div class="carte">${lignes.map(({ def, r, pond, f }) => {
      const cible = R().cibles[def.id] || 0;
      const total = r + pond;
      const taux = cible ? total / cible : 0;
      const cls = taux >= 1 ? 'ok' : '';
      return `<div class="prev">
        <div class="prev-l1"><span>${esc(def.label)}</span><b>${f(total)} <small class="item-l2">/ ${f(cible)}${def.unite === 'unites' ? ' u' : ''} · ${pct(taux)}</small></b></div>
        <div class="prev-detail">Réalisé ${f(r)} + pondéré ${f(pond)}${def.unite === 'unites' ? ' (quantité × %)' : ''}</div>
        <div class="barre fine ${cls}"><div class="barre-rempli" style="width:${clamp(taux * 100, 0, 100)}%"></div></div>
      </div>`;
    }).join('')}</div></section>`;
}

function sectionVentesFamilles(sel) {
  const a = agregatsVentes(sel);
  const groupes = GROUPES.filter(g => g.id !== 'sav' && a.parGroupe[g.id]);
  let corps;
  if (!groupes.length) corps = `<p class="vide-mini">Aucune vente commerciale sur la période.</p>`;
  else corps = groupes.map(g => {
    const G = a.parGroupe[g.id];
    const machine = g.id === 'machine';
    const fams = FAMILLES.filter(f => f.groupe === g.id && G.familles[f.id]);
    return `<details class="arbre"><summary><span class="nom">${esc(g.label)}</span><span class="val">${eur(G.ca)}${machine ? `<small>${pluriel(G.qte, 'unité')}</small>` : ''}</span></summary>
      ${fams.map(f => {
        const F = G.familles[f.id];
        const prods = Array.from(F.produits.entries()).sort((x, y) => y[1].ca - x[1].ca);
        return `<details class="arbre"><summary><span class="nom">${esc(f.label)}</span><span class="val">${eur(F.ca)}${machine ? `<small>${pluriel(F.qte, 'unité')}</small>` : ''}</span></summary>
          <ul>${prods.map(([id, P]) => { const pr = produit(id); return `<li><span>${esc(pr ? pr.designation : 'Produit supprimé')}</span><span>${eur(P.ca)} · ${P.qte} u</span></li>`; }).join('')}</ul></details>`;
      }).join('')}
    </details>`;
  }).join('');
  return `<section class="section" aria-labelledby="t-vf"><h2 class="section-titre" id="t-vf">Ventes par groupe et famille <small>${esc(sel.libelle)}</small></h2><div class="carte">${corps}</div></section>`;
}

function sectionDistributeurs(sel) {
  const a = agregatsVentes(sel);
  const po = periodeObjectif();
  const contrats = etat.distributeurs.filter(d => dansPeriode(d.dateSignature, sel)).length;
  let cible = R().cibles.distrib || 0, lisse = false;
  if (ui.vue.mode !== 'objectif') {
    const inter = intersection(sel, po);
    cible = inter ? cible * joursPeriode(inter) / joursPeriode(po) : 0;
    lisse = true;
  }
  let meilleur = null;
  for (const [id, ca] of a.parDistrib) if (!meilleur || ca > meilleur.ca) meilleur = { id, ca };
  const md = meilleur ? distributeur(meilleur.id) : null;
  return `<section class="section" aria-labelledby="t-dis"><h2 class="section-titre" id="t-dis">Distributeurs <small>${esc(sel.libelle)}</small></h2>
    <div class="carte">
      <div class="kv"><span>Contrats signés</span><b>${contrats} / ${lisse ? nb1(cible) + ' lissé' : nb1(cible)}</b></div>
      <div class="kv"><span>CA via distributeurs</span><b>${eur(a.caDistrib)}</b></div>
      <div class="kv"><span>Part du CA commercial</span><b>${a.caCommercial ? pct(a.caDistrib / a.caCommercial) : '—'}</b></div>
      <div class="kv"><span>Meilleur distributeur</span><span>${md ? `${esc(md.nom)}<small>${eur(meilleur.ca)}</small>` : '—'}</span></div>
    </div></section>`;
}

function sectionKpi(sel) {
  const t = transformation(sel);
  const a = agregatsVentes(sel);
  const panier = a.nbVentesCom ? a.caCommercial / a.nbVentesCom : null;
  const pDirect = a.caCommercial ? a.caDirect / a.caCommercial : 0;
  const pDistrib = a.caCommercial ? a.caDistrib / a.caCommercial : 0;
  return `<section class="section" aria-labelledby="t-kpi"><h2 class="section-titre" id="t-kpi">KPI commerciaux <small>${esc(sel.libelle)}</small></h2>
    <div class="carte">
      <div class="stats2">
        <div><div class="stat-label">Transformation (nb)</div><div class="stat-valeur">${t.tauxNb == null ? '—' : pct(t.tauxNb)}</div><div class="item-l2">${t.g} gagnée${t.g > 1 ? 's' : ''} / ${t.g + t.pe} clôturée${t.g + t.pe > 1 ? 's' : ''}</div></div>
        <div><div class="stat-label">Transformation (CA)</div><div class="stat-valeur">${t.tauxCa == null ? '—' : pct(t.tauxCa)}</div><div class="item-l2">${eurCompact(t.caG)} / ${eurCompact(t.caG + t.caP)}</div></div>
      </div>
      <div class="kv" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bord)"><span>Panier moyen</span><b>${panier == null ? '—' : eur(panier)}<small>${pluriel(a.nbVentesCom, 'vente commerciale', 'ventes commerciales')}</small></b></div>
      <div class="kv"><span>CA commercial</span><b>${eur(a.caCommercial)}</b></div>
      <div style="padding-top:12px;border-top:1px solid var(--bord)">
        <div class="stat-label">Répartition direct / distributeurs</div>
        <div class="repart" role="img" aria-label="Direct ${pct(pDirect)}, distributeurs ${pct(pDistrib)}"><span class="r1" style="width:${pDirect * 100}%"></span><span class="r2" style="width:${pDistrib * 100}%"></span></div>
        <div class="legende"><span><i style="background:var(--accent)"></i>Direct ${pct(pDirect)} · ${eurCompact(a.caDirect)}</span><span><i style="background:var(--doux)"></i>Distributeurs ${pct(pDistrib)} · ${eurCompact(a.caDistrib)}</span></div>
      </div>
    </div></section>`;
}

function rdvAVenir() {
  const t = aujourdhui();
  return etat.rdvs.filter(r => !r.fait && r.date >= t).sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
}

function sectionProchainsRdv(sel) {
  const prochains = rdvAVenir().slice(0, 3);
  const faits = etat.rdvs.filter(r => r.fait && dansPeriode(r.date, sel)).length;
  return `<section class="section" aria-labelledby="t-rdv"><h2 class="section-titre" id="t-rdv">Prochains RDV <button class="lien" data-action="aller-rdv">Tout voir</button></h2>
    <div class="carte">
      ${prochains.length ? prochains.map(r => `<div class="mini-rdv" role="button" tabindex="0" data-action="ouvrir-rdv" data-id="${r.id}">
        <div><b>${fmtJJMM(r.date)}</b><span>${esc(r.heure)}</span></div>
        <div><b>${esc(r.client)}</b><span>${esc(FAMILLE[r.famille] ? FAMILLE[r.famille].label : '')}${r.produitId && produit(r.produitId) ? ' · ' + esc(produit(r.produitId).designation) : ''}</span></div>
      </div>`).join('') : '<p class="vide-mini">Aucun RDV à venir.</p>'}
      <div class="kv" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bord)"><span>RDV faits sur la période</span><b>${faits}</b></div>
    </div></section>`;
}

function sectionSav(sel) {
  const a = agregatsVentes(sel);
  const p = pipeline();
  return `<section class="section" aria-labelledby="t-sav"><h2 class="section-titre" id="t-sav">SAV <small>comptabilisé à part, hors objectifs</small></h2>
    <div class="carte bloc-sav">
      <div class="stats3">
        <div><div class="stat-label">CA SAV</div><div class="stat-valeur">${eurCompact(a.caSav)}</div></div>
        <div><div class="stat-label">Affaires</div><div class="stat-valeur">${a.nbSav}</div></div>
        <div><div class="stat-label">Offres en cours</div><div class="stat-valeur">${p.savNb}</div></div>
      </div>
      ${p.savNb ? `<div class="item-l2" style="margin-top:8px">Offres SAV en cours : ${eur(p.savCa)}</div>` : ''}
    </div></section>`;
}

/* =====================================================================
   ÉCRAN OFFRES
   ===================================================================== */
function ecranOffres() {
  const enCours = etat.offres.filter(o => o.statut === 'en_cours');
  const aRelancer = enCours.filter(o => o.relanceManuelle && o.dateRelance).sort((a, b) => a.dateRelance.localeCompare(b.dateRelance));
  const closes = etat.offres.filter(o => o.statut !== 'en_cours').sort((a, b) => (b.dateCloture || '').localeCompare(a.dateCloture || '') || b.modifieLe.localeCompare(a.modifieLe));
  const f = ui.filtreOffres;
  let liste = f === 'relancer' ? aRelancer : f === 'closes' ? closes : enCours.slice().sort((a, b) => b.dateEmission.localeCompare(a.dateEmission) || b.creeLe.localeCompare(a.creeLe));
  const b = (id, l, n) => `<button type="button" data-action="filtre-offres" data-id="${id}" aria-pressed="${f === id}">${l}<span class="compte">${n}</span></button>`;
  let h = `<div class="segment" role="group" aria-label="Filtrer les offres" style="margin-bottom:14px">${b('en_cours', 'En cours', enCours.length)}${b('relancer', 'À relancer', aRelancer.length)}${b('closes', 'Clôturées', closes.length)}</div>`;
  if (liste.length) {
    let brut = 0, pond = 0, sav = 0;
    for (const o of liste) { const c = caCommercialDoc(o); brut += c; pond += c * o.chance / 100; sav += totalDoc(o) - c; }
    h += `<div class="resume"><span>${pluriel(liste.length, 'offre')}</span><span>Brut <b>${eur(brut)}</b></span><span>Pondéré <b>${eur(pond)}</b></span>${sav ? `<span>+ SAV ${eur(sav)}</span>` : ''}</div>`;
    h += `<div class="pile">${liste.map(o => carteOffre(o, f)).join('')}</div>`;
  } else {
    const msg = f === 'relancer' ? 'Aucune offre en relance manuelle.' : f === 'closes' ? 'Aucune offre clôturée.' : 'Aucune offre en cours.';
    h += etatVide(msg, 'nouvelle-offre', 'Nouvelle offre');
  }
  return { entete: entete('Offres', { action: boutonAjout('nouvelle-offre', 'Offre') }), corps: h };
}

function carteOffre(o, filtre) {
  const total = totalDoc(o);
  const er = etatRelance(o);
  const n = o.lignes.length;
  let pastilles = `<span class="pastille ${o.affaire === 'SAV' ? 'contour' : ''}">${esc(o.affaire)}</span>`;
  if (o.statut === 'en_cours') {
    pastilles += `<span class="pastille">${o.chance} %</span><span class="pastille">Pond. ${eur(total * o.chance / 100)}</span><span class="pastille ${er.cls}">${esc(er.libelle)}</span>`;
  } else {
    pastilles += o.statut === 'gagnee' ? `<span class="pastille ok">Gagnée le ${fmtJJMM(o.dateCloture)}</span>` : `<span class="pastille bad">Perdue le ${fmtJJMM(o.dateCloture)}</span>`;
  }
  return `<article class="carte cliquable" role="button" tabindex="0" data-action="ouvrir-offre" data-id="${o.id}" aria-label="Offre ${esc(o.client)}">
    <div class="item-date">Émise le ${fmtDate(o.dateEmission)}</div>
    <div class="item-l1"><div class="item-titre">${esc(o.client)}${o.idClient ? `<span class="item-id">${esc(o.idClient)}</span>` : ''}</div><div class="item-montant">${eur(total)}</div></div>
    <div class="item-l2">${pluriel(n, 'ligne')} · ${esc(produitPrincipal(o))}</div>
    <div class="pastilles">${pastilles}</div>
    ${filtre === 'relancer' ? `<div class="item-actions"><button class="btn btn-sec btn-petit" data-action="relance" data-id="${o.id}">${ICONES.coche}Relancé</button></div>` : ''}
  </article>`;
}

/* =====================================================================
   ÉCRAN VENTES
   ===================================================================== */
function ecranVentes() {
  const sel = periodeSelectionnee();
  const liste = etat.ventes.filter(v => dansPeriode(v.date, sel)).sort((a, b) => b.date.localeCompare(a.date) || b.creeLe.localeCompare(a.creeLe));
  let h = selecteurPeriode();
  if (liste.length) {
    let com = 0, sav = 0;
    for (const v of liste) { const c = caCommercialDoc(v); com += c; sav += totalDoc(v) - c; }
    h += `<div class="resume"><span><b>${pluriel(liste.length, 'vente')}</b></span><span>CA commercial <b>${eur(com)}</b></span>${sav ? `<span>SAV <b>${eur(sav)}</b></span>` : ''}</div>`;
    h += `<div class="pile">${liste.map(carteVente).join('')}</div>`;
  } else {
    h += etatVide('Aucune vente sur cette période.', 'nouvelle-vente', 'Nouvelle vente');
  }
  return { entete: entete('Ventes', { action: boutonAjout('nouvelle-vente', 'Vente') }), corps: h };
}

function carteVente(v) {
  return `<article class="carte cliquable" role="button" tabindex="0" data-action="ouvrir-vente" data-id="${v.id}" aria-label="Vente ${esc(v.client)}">

    <div class="item-l2">${esc(produitPrincipal(v))}${v.lignes.length > 1 ? ` + ${v.lignes.length - 1} autre${v.lignes.length > 2 ? 's' : ''}` : ''}</div>
    <div class="pastilles"><span class="pastille ${v.affaire === 'SAV' ? 'contour' : ''}">${esc(v.affaire)}</span><span class="pastille">${esc(libelleCanal(v))}</span></div>

}

/* =====================================================================
   COMPOSANTS : feuilles, modales, toasts, champs
   ===================================================================== */
const pileFeuilles = [];
let compteurForm = 0;
const prefixe = () => 'f' + (++compteurForm) + '-';

/** Ouvre une feuille plein écran. Renvoie l'élément. */
function ouvrirFeuille({ titre, contenu, pied = '', onFermer = null, sansContenu = false }) {
  const el = document.createElement('div');
  el.className = 'feuille';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', titre);
  el.innerHTML = `<div class="feuille-tete"><button type="button" class="btn-texte" data-fermer>Annuler</button><h2>${esc(titre)}</h2><span></span></div>
    <div class="feuille-corps">${sansContenu ? contenu : `<div class="feuille-contenu">${contenu}</div>`}</div>
    ${pied ? `<div class="feuille-pied"><div>${pied}</div></div>` : ''}`;
  el._focusAvant = document.activeElement;
  el._onFermer = onFermer;
  retirerToasts(); // les toasts concernent l'écran du dessous
  $('#feuilles').appendChild(el);
  pileFeuilles.push(el);
  document.body.classList.add('feuille-ouverte');
  $('#app').setAttribute('aria-hidden', 'true');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('ouverte')));
  el.querySelector('[data-fermer]').addEventListener('click', () => fermerFeuille(el));
  return el;
}
function fermerFeuille(el) {
  const i = pileFeuilles.indexOf(el);
  if (i < 0) return;
  pileFeuilles.splice(i, 1);
  el.classList.remove('ouverte');
  if (el._onFermer) el._onFermer();
  setTimeout(() => el.remove(), 300);
  if (!pileFeuilles.length) {
    document.body.classList.remove('feuille-ouverte');
    $('#app').removeAttribute('aria-hidden');
  }
  try { if (el._focusAvant && document.contains(el._focusAvant)) el._focusAvant.focus({ preventScroll: true }); } catch (e) { /* rien */ }
}
function fermerToutesFeuilles() { [...pileFeuilles].reverse().forEach(fermerFeuille); }

/**
 * Fenêtre modale intégrée (remplace confirm()). boutons : [{ libelle, cls, valeur }]
 * Renvoie une promesse résolue avec la valeur du bouton choisi (null si fermeture).
 */
function modale({ titre, html = '', message = '', boutons, onMount }) {
  return new Promise(resolve => {
    const fond = document.createElement('div');
    fond.className = 'modale-fond';
    fond.innerHTML = `<div class="modale" role="alertdialog" aria-modal="true" aria-labelledby="mod-t">
      <h2 id="mod-t">${esc(titre)}</h2>${message ? `<p>${esc(message)}</p>` : ''}${html}
      <div class="actions">${boutons.map((b, i) => `<button type="button" class="btn btn-bloc ${b.cls || 'btn-sec'}" data-i="${i}">${esc(b.libelle)}</button>`).join('')}</div></div>`;
    document.body.appendChild(fond);
    const avant = document.activeElement;
    requestAnimationFrame(() => fond.classList.add('ouverte'));
    const fermer = v => {
      fond.classList.remove('ouverte');
      setTimeout(() => fond.remove(), 200);
      try { if (avant && document.contains(avant)) avant.focus({ preventScroll: true }); } catch (e) { /* rien */ }
      resolve(v);
    };
    fond.addEventListener('click', async e => {
      if (e.target === fond) return fermer(null);
      const b = e.target.closest('[data-i]');
      if (!b) return;
      const def = boutons[+b.dataset.i];
      if (def.avant) { const ok = await def.avant(fond); if (ok === false) return; }
      fermer(def.valeur);
    });
    fond.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(null); });
    if (onMount) onMount(fond);
    const premier = fond.querySelector('input, select, textarea') || fond.querySelector('[data-i]');
    setTimeout(() => premier && premier.focus({ preventScroll: true }), 50);
  });
}
async function confirmer(titre, message, libelleOk = 'Confirmer', danger = false) {
  const v = await modale({ titre, message, boutons: [
    { libelle: libelleOk, cls: danger ? 'btn-danger-plein' : 'btn-prim', valeur: true },
    { libelle: 'Annuler', cls: 'btn-sec', valeur: false },
  ] });
  return v === true;
}

/** Toast de confirmation. action = { libelle, fn } facultatif. */
function toast(message, type = 'ok', action = null, duree = 3000) {
  retirerToasts(); // un seul toast à la fois
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.setAttribute('role', type === 'bad' ? 'alert' : 'status');
  t.innerHTML = `<p>${esc(message)}</p>${action ? `<button type="button">${esc(action.libelle)}</button>` : ''}`;
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  const retirer = () => { t.classList.remove('visible'); setTimeout(() => t.remove(), 250); };
  let minuterie = setTimeout(retirer, action ? Math.max(duree, 6000) : duree);
  if (action) t.querySelector('button').addEventListener('click', () => { clearTimeout(minuterie); retirer(); action.fn(); });
}
function retirerToasts() { $$('#toasts .toast').forEach(t => t.remove()); }
